# Sealant self-host — the whole product in one `docker compose up`, from prebuilt images.
#
# Brings up Postgres + a one-shot DB migration + the API + the build worker + the SSH gateway + the
# web app. The job queue lives in Postgres (pg-boss) and workspace images live in the host Docker
# Engine that builds and runs them, so there is no broker and no registry process to run. Driven by
# ./install.sh (the curl one-liner), which downloads
# this file, generates secrets into a sibling .env, and starts everything. To run it by hand instead,
# create a .env next to this file with the required secrets:
#
#   WORKSPACE_SSH_GATEWAY_TOKEN=<long random string>
#   BETTER_AUTH_SECRET=<long random string, min 32 chars>
#
# then: docker compose -f compose.selfhost.yaml up -d
#
# Requirements: a running Docker daemon (the worker drives it, via the mounted socket, to build images
# and launch workspaces) and Docker Compose v2. Everything binds to loopback by default: web 3000,
# API 4000, SSH gateway 2222. Postgres stays internal. Set SEALANT_BIND_HOST=0.0.0.0 to expose
# web/API/SSH beyond the machine.
# Private GitHub repos need GITHUB_APP_* (see README) — public repos (the default demo) need nothing.
name: sealant

x-db-url: &db-url postgresql://sealant:${SEALANT_DB_PASSWORD:-sealant}@postgres:5432/sealant_control_plane
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sealant
      POSTGRES_PASSWORD: ${SEALANT_DB_PASSWORD:-sealant}
      POSTGRES_DB: sealant_control_plane
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sealant -d sealant_control_plane"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: apply DB migrations + seed the default owner principal before the API/worker/web start,
  # then exit. Runs the prebuilt api image's bundled migrate entrypoint — no source tree needed.
  migrate:
    image: ${SEALANT_IMAGE_NS:-ghcr.io/sealant-sh}/sealant-api:${SEALANT_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *db-url
    command: ["node", "dist/migrate.js"]
    restart: "no"

  api:
    image: ${SEALANT_IMAGE_NS:-ghcr.io/sealant-sh}/sealant-api:${SEALANT_VERSION:-latest}
    # sealantd deliberately exposes its control socket as 0600/root and validates SO_PEERCRED.
    # The API is a trusted control-plane caller, so it must connect as that uid. Its socket mount is
    # read-only and does not expose the host Docker daemon.
    user: "0:0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${SEALANT_BIND_HOST:-127.0.0.1}:${SEALANT_API_PORT:-4000}:4000"
    volumes:
      - /run/sealant/sockets:/run/sealant/sockets:ro
    environment:
      PORT: "4000"
      DATABASE_URL: *db-url
      CORS_ALLOWED_ORIGINS: ${SEALANT_CORS_ALLOWED_ORIGINS:-*}
      # Shared secret with the SSH gateway (authenticates resolve-principal + connection-target
      # lookups), plus the endpoint the UI renders into `ssh` commands for users.
      WORKSPACE_SSH_GATEWAY_TOKEN:
        ${WORKSPACE_SSH_GATEWAY_TOKEN:?set in .env — run install.sh or generate a long random
        string}
      WORKSPACE_SSH_GATEWAY_HOST: ${SEALANT_SSH_HOST:-localhost}
      WORKSPACE_SSH_GATEWAY_PORT: ${SEALANT_SSH_PORT:-2222}
      WORKSPACE_SSH_GATEWAY_USERNAME_PREFIX: ws
      # Private GitHub repos (see README). Compose only interpolates .env into ${...} — without
      # these lines the values would never reach the container.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      # Shared with the worker: API encrypts connected-account credentials, worker decrypts them.
      SEALANT_CREDENTIALS_KEY: ${SEALANT_CREDENTIALS_KEY:-}
      # Service principals (comma-separated bearer secrets). Set = every /v1 request must carry
      # one (a product such as Mend acting for its users); unset = the open loopback-only model.
      # The web app does not hold a service key, so set this only on API-only deployments.
      SEALANT_SERVICE_KEYS: ${SEALANT_SERVICE_KEYS:-}
      # Mount-sourced workspaces are opt-in: the API rejects host paths outside these roots.
      SEALANT_MOUNT_ALLOWED_STORE_ROOTS: ${SEALANT_MOUNT_ALLOWED_STORE_ROOTS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  worker:
    image: ${SEALANT_IMAGE_NS:-ghcr.io/sealant-sh}/sealant-worker:${SEALANT_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # The worker drives the host Docker daemon to build images + launch workspaces. Built images
      # stay in that daemon (no registry): the worker tags them, workspaces run from them. Rootless Docker
      # hosts can point DOCKER_SOCKET_PATH at their user socket.
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Shared host dir where each workspace's control socket is exposed, so the gateway reaches the
      # in-workspace daemon directly (unix://) with no Docker access. Must be the same real host path
      # here, in the gateway, and in the workspace bind-mounts the host daemon creates.
      - /run/sealant/sockets:/run/sealant/sockets
    environment:
      DATABASE_URL: *db-url
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      SEALANT_CREDENTIALS_KEY: ${SEALANT_CREDENTIALS_KEY:-}
      DEFAULT_SSH_ENDPOINT_EXPOSURE_STRATEGY: container-network
      WORKSPACE_CONTROL_SOCKET_HOST_DIR: /run/sealant/sockets
      # The worker passes the same allowlist into every workspace daemon for defense in depth.
      SEALANT_MOUNT_ALLOWED_STORE_ROOTS: ${SEALANT_MOUNT_ALLOWED_STORE_ROOTS:-}
      # Optional strict named-volume lowering. A deployment override must also mount every named
      # volume into this worker at its mapped logical root.
      SEALANT_DOCKER_VOLUME_MAPPINGS: ${SEALANT_DOCKER_VOLUME_MAPPINGS:-}
      # Optional existing Docker network every workspace joins, so sibling Compose services resolve
      # by name from inside a workspace. The network must already exist; the worker never creates it.
      SEALANT_DOCKER_WORKSPACE_NETWORK: ${SEALANT_DOCKER_WORKSPACE_NETWORK:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Bridge networking (unlike the dev compose): everything the gateway talks to is a container, so it
  # reaches the API by service DNS and needs no host networking, no firewall rules. It listens on
  # 0.0.0.0 INSIDE the container (binding container-loopback would make the published port
  # unreachable) and is published on host loopback by default.
  ssh-gateway:
    image: ${SEALANT_IMAGE_NS:-ghcr.io/sealant-sh}/sealant-ssh-gateway:${SEALANT_VERSION:-latest}
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "${SEALANT_BIND_HOST:-127.0.0.1}:${SEALANT_SSH_PORT:-2222}:2222"
    volumes:
      - gateway-keys:/keys
      # Read-only access to the per-workspace control sockets the worker exposes here. The gateway
      # connects to them directly (unix://) — NO Docker socket, so a gateway compromise cannot reach
      # the host Docker daemon (which would be host root). The worker has the socket; the gateway must not.
      - /run/sealant/sockets:/run/sealant/sockets:ro
    environment:
      SSH_GATEWAY_HOST: 0.0.0.0
      SSH_GATEWAY_PORT: 2222
      # First boot generates an ed25519 host key into the gateway-keys volume; it is never rotated
      # after that, so client known_hosts entries stay valid across upgrades.
      SSH_GATEWAY_HOST_KEY_PATH: /keys/ssh_gateway_host_key
      SSH_GATEWAY_HOST_KEY_AUTOGENERATE: "true"
      # Optional operator break-glass allowlist; a missing file just means "no static keys" (users
      # register keys in the web UI, resolved via the API per connection).
      SSH_GATEWAY_ALLOWED_KEYS_FILE: /keys/gateway_allowed_keys
      SSH_GATEWAY_WORKSPACE_USERNAME_PREFIX: ws
      CORE_API_BASE_URL: http://api:4000
      WORKSPACE_SSH_GATEWAY_TOKEN:
        ${WORKSPACE_SSH_GATEWAY_TOKEN:?set in .env — run install.sh or generate a long random
        string}
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "const
          s=require('net').connect(2222,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  web:
    image: ${SEALANT_IMAGE_NS:-ghcr.io/sealant-sh}/sealant-web:${SEALANT_VERSION:-latest}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SEALANT_BIND_HOST:-127.0.0.1}:${SEALANT_WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # The web server hosts Better Auth (email+password) and talks to Postgres directly for it.
      DATABASE_URL: *db-url
      BETTER_AUTH_SECRET:
        ${BETTER_AUTH_SECRET:?set in .env — run install.sh or generate a random string of at least
        32 chars}
      BETTER_AUTH_URL: ${SEALANT_WEB_URL:-http://localhost:${SEALANT_WEB_PORT:-3000}}
      BETTER_AUTH_TRUSTED_ORIGINS: ${SEALANT_WEB_TRUSTED_ORIGINS:-http://localhost:${SEALANT_WEB_PORT:-3000},http://127.0.0.1:${SEALANT_WEB_PORT:-3000}}
      # Server-side tRPC context calls the API over the compose network.
      CORE_API_BASE_URL: http://api:4000
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  gateway-keys:
