name: Boat harness

# The local Boat harness (packages/workspaces/boat-harness): sealant's real worker, API, Boat
# adapter, guest units and gateway against a fake Boat provider and guest-twin containers. It runs
# on pull requests that touch Boat code, nightly, and on demand. Every run runs every group.
on:
  pull_request:
    paths:
      - packages/workspaces/boat-harness/**
      - packages/workspaces/boat-image/**
      - packages/workspaces/boat-tunnel/**
      - packages/workspaces/src/runtime/boat/**
      - packages/workspaces/src/images/boat/**
      - packages/workspaces/src/worker/boat-*.ts
      - packages/workspaces/src/worker/process-workspace-*.ts
      - packages/workspaces/src/resources/boat-tunnel.ts
      - packages/db/src/repositories/boat-*.ts
      - packages/db/src/repositories/native-publications.ts
      - packages/db/src/repositories/capture-preservation.ts
      - packages/db/src/repositories/workspace-capture-drains.ts
      - packages/db/src/repositories/workspace-runtime-instances.ts
      - apps/worker/src/workers/workspaces.ts
      - apps/api/src/routes/workspaces/**
      - .github/workflows/boat-harness.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # One runner per group of harness files: a runner is its own Docker host, and each file brings
  # up its own stack. `harness-files.test.ts` fails when a harness file is in no group or in two.
  # Minutes are about twice a group's usual harness step, which leaves room to build the twin base
  # image when its cache misses.
  harness:
    name: Boat harness (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Happy path, Docker, the shared stop's FINAL and deletion cases: about 15 minutes.
          - group: lifecycle
            files: boat-harness/lifecycle.harness.ts
            step-minutes: 35
            job-minutes: 50
          # One fault per step, then resource links: about 19 minutes.
          - group: faults
            files: boat-harness/faults.harness.ts
            step-minutes: 45
            job-minutes: 60
          # A ready session's daemon and its deletion: about 17 minutes.
          - group: daemon
            files: boat-harness/daemon.harness.ts
            step-minutes: 40
            job-minutes: 55
          # Workspaces without resources, the shared stop's worker-killed cases: about 17 minutes.
          - group: no-resources
            files: boat-harness/no-resources.harness.ts
            step-minutes: 40
            job-minutes: 55
    steps:
      # The published snapshot image is about 6 GB and each twin adds a writable layer. Drop the
      # runner's preinstalled toolchains this job never uses (an ephemeral VM, not a shared host).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Twins share the runner's kernel and cannot load modules themselves. They need kernel
      # WireGuard: Boat's provider `wg0`, and the guest's own end of the carried resource tunnel.
      - name: Kernel WireGuard
        run: sudo modprobe wireguard && lsmod | grep -q '^wireguard'

      # The twin base image needs Ubuntu's archive and snapshot service to build (the snapshot is the
      # only source of the pinned systemd). Cached by the twin's own files, a job builds it only
      # when they change, so an Ubuntu outage cannot turn every run red. At run time the stack reads
      # a mirror when only the mirror answers (stack.ts).
      - name: Restore the twin base image
        id: twin-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/boat-twin-base.tar
          key: boat-twin-${{ hashFiles('packages/workspaces/boat-harness/twin/**') }}

      - name: Load the twin base image
        if: steps.twin-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/boat-twin-base.tar

      # A step timeout fails the step instead of cancelling the job, so the logs still upload.
      - name: Run the harness
        timeout-minutes: ${{ matrix.step-minutes }}
        env:
          BOAT_HARNESS_VERBOSE: "1"
        run: pnpm boat:harness ${{ matrix.files }}

      - name: Export the twin base image
        id: twin-export
        if: always() && steps.twin-cache.outputs.cache-hit != 'true'
        run: |
          tags=$(docker image ls --filter reference='sealant-boat-harness-twin:*' --format '{{.Repository}}:{{.Tag}}' | grep -v -- '-mirror$' || true)
          if [ -n "$tags" ]; then
            docker save -o /tmp/boat-twin-base.tar $tags
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache the twin base image
        if: always() && steps.twin-export.outputs.saved == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/boat-twin-base.tar
          key: boat-twin-${{ hashFiles('packages/workspaces/boat-harness/twin/**') }}

      - name: Keep the harness logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boat-harness-logs-${{ matrix.group }}
          path: |
            /tmp/boat-harness-*/*.log
            /tmp/boat-harness-*/*.json
          if-no-files-found: ignore

  # The harness's one result: passes only when every group passed.
  boat-checks:
    name: boat checks
    if: always()
    needs: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every harness group passed
        env:
          RESULT: ${{ needs.harness.result }}
        run: |
          echo "Boat harness groups: $RESULT"
          test "$RESULT" = success
