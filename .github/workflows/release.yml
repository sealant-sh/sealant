# Release: on a v*.*.* tag, build + push the multi-arch product images to GHCR, smoke-test the
# packaged install end-to-end (install.sh against the just-pushed images), publish the GitHub
# release with the compose file attached — which is what makes `releases/latest` (and therefore the
# curl|sh installer) resolve to this version — and publish @sealant/sdk + @sealant/api-contracts to
# npm. Mirrors sealantd's release workflow. The npm job runs in parallel with the image pipeline;
# if only one side fails, re-run just the failed jobs (`gh run rerun <id> --failed`) — a full re-run
# would hit npm's "cannot republish an existing version".
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Before anything builds or publishes: the tag is a stable vX.Y.Z (prereleases publish from main,
  # in next.yml), and no sealantd prerelease is pinned anywhere (ADR 0015 in sealant-sh/mend).
  pins:
    name: Check what the release pins
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      # Full history: the prerelease check asks whether each next build's commit is an ancestor.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Refuse a prerelease tag or a prerelease sealantd
        run: node tooling/scripts/check-release-pins.mjs "$GITHUB_REF_NAME"

      # One built from a commit this tag leaves out sorts below X.Y.Z but holds more: refuse. Main
      # is frozen from the Version Packages merge to this tag (sealant-sh/mend
      # docs/operations/next-channel.md); a merge during the freeze is what produces one.
      - name: Refuse a release that leaves out one of its next builds
        run: >-
          node tooling/scripts/next-version.mjs --stray "$GITHUB_REF_NAME" --npm @sealant/sdk-next
          HEAD

  image:
    name: Image (${{ matrix.name }})
    needs: pins
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sealant-api
            dockerfile: apps/api/Dockerfile
          - name: sealant-worker
            dockerfile: apps/worker/Dockerfile
          - name: sealant-ssh-gateway
            dockerfile: apps/ssh-gateway/Dockerfile
          - name: sealant-web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # QEMU emulates arm64 on the amd64 runner; native arm64 runners + a per-arch matrix can
      # replace this later (same follow-up as sealantd).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker builder (Blacksmith cache)
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The web image must never receive VITE_API_URL at build time — the server reads
      # CORE_API_BASE_URL at runtime, and a baked VITE_ value would shadow it.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Run the real installer against the images just pushed: stack must come up healthy (API, web,
  # SSH gateway) from a clean machine with only Docker — the same contract users get.
  selfhost-smoke:
    name: Self-host install smoke
    needs: image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Pull ANONYMOUSLY, exactly like a user: GHCR authorizes GITHUB_TOKEN by package↔repo linkage
    # (not visibility), and logging in with it 403'd even on public packages during the v0.1.0
    # release. Anonymous pulls of public packages always work. Consequence: the first release of any
    # NEW image name fails here until its GHCR package is flipped public — flip it, then re-run the
    # failed jobs (`gh run rerun <id> --failed`).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run installer against the tagged images
        env:
          SEALANT_VERSION: ${{ github.ref_name }}
          SEALANT_COMPOSE_URL: ${{ github.workspace }}/compose.selfhost.yaml
        # compose version first: the runner's compose behaved differently from local ones during the
        # v0.1.x releases — keep it in the logs for debugging.
        run: |
          docker compose version
          sh install.sh

      - name: Assert SSH gateway is listening
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then exec 3>&-; echo "gateway up"; exit 0; fi
            sleep 2
          done
          echo "gateway did not come up" >&2
          docker compose --project-directory ~/.config/sealant logs ssh-gateway >&2
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose --project-directory ~/.config/sealant logs

  # Prove the workspace runtime contract against the PINNED sealantd image before anything
  # publishes: build the baked fedora workspace image (which pulls the exact
  # ghcr.io/sealant-sh/sealantd pin from buildkit-builder.ts), then run the sealantd e2e suite in
  # required mode — an absent image FAILS the job instead of skipping the specs. A daemon/pin
  # mismatch (e.g. env inheritance drift) stops the release here rather than shipping an SDK whose
  # documented behavior the runtime does not honor.
  workspace-e2e:
    name: Workspace runtime e2e (pinned sealantd)
    needs: pins
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the baked workspace image (pulls the pinned sealantd)
        run:
          DOCKER_BUILDKIT=1 pnpm --filter @sealant/workspaces exec tsx
          scripts/sealantd-build-image.mts

      - name: Run sealantd e2e suite (image required, never skipped)
        env:
          SEALANT_E2E_REQUIRE_IMAGE: "1"
        run: pnpm --filter @sealant/workspaces test:e2e src/sealantd

      - name: Containerized launcher and real workspace volume test
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/runtime/docker-volume-mounts.e2e.ts

  npm:
    name: Publish npm packages
    needs: workspace-e2e
    # Kept on a github-hosted runner: OIDC Trusted Publishing (tokenless npm auth + provenance)
    # should mint its id-token on infrastructure GitHub controls, not a third-party runner.
    # npm trusted publishing (OIDC) needs a GitHub-hosted runner: this job stays off Blacksmith.
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers on `release` in repo settings, and
    # register both packages' npm Trusted Publishers against this repo + release.yml + this
    # environment. (The very first publish of a brand-new package name must be done manually with
    # an npm token/OTP — trusted publishing attaches to an existing package.)
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # No pnpm store cache: jobs running unowned code (next.yml's test and workspace-e2e,
      # kubernetes-e2e) write it, and pnpm links store files without re-hashing them.
      # Node 24, NOT 22: trusted publishing needs the bundled npm >= 11.5 (node 22 ships npm 10,
      # which silently skips the OIDC exchange and the registry 404s the anonymous publish).
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The git tag is the single version authority: overwrite both package.json versions from it
      # so the published versions always match the release, regardless of what is committed.
      - name: Sync package versions from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm --filter "@sealant/api-contracts" --filter "@sealant/sdk" \
            exec npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: pnpm --filter "@sealant/api-contracts" --filter "@sealant/sdk" run build

      # Tokenless OIDC Trusted Publishing: `registry-url` + `id-token: write` is the whole auth
      # mechanism (no NPM_TOKEN secret). `--provenance` attaches the public build attestation.
      - name: Publish to npm
        run: |
          pnpm --filter "@sealant/api-contracts" --filter "@sealant/sdk" \
            publish --access public --no-git-checks --provenance

  release:
    name: Publish GitHub release
    needs: [selfhost-smoke, workspace-e2e]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The attached compose file is what install.sh downloads, and install.sh itself is attached so
      # `releases/latest/download/install.sh` (the get.sealant.dev redirect target) always serves
      # the exact script shipped with the release. Creating the release is also what moves
      # `releases/latest` (the installer's default version) to this tag.
      - name: Create release with compose + installer assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          gh release create "$GITHUB_REF_NAME" compose.selfhost.yaml install.sh --generate-notes
          --verify-tag
