# Release: a vX.Y.Z tag releases Core: the four product images on GHCR, @sealant/sdk and
# @sealant/api-contracts on npm, and the GitHub release whose assets install.sh downloads. In order:
#
# 1. build pushes each image's two platforms by digest, untagged; merge stages each image's index
#    under this run's own tag, staging-<run>-<attempt>, and release-manifest records every digest.
# 2. selfhost-smoke runs install.sh on amd64 and on arm64 against those digests, and workspace-e2e
#    proves the pinned sealantd; acceptance passes only when all three passed.
#    pack builds and packs the two npm packages with no credential, and the manifest records each
#    tarball's sha512.
# 3. finalize-images writes each :<version>, once, from the accepted index; npm publishes exactly
#    the packed tarballs under the stable floor; then the GitHub release is created without
#    becoming latest; promote moves each :latest to the accepted index under the floor, and moves
#    GitHub's latest release last.
#
# Only finalize-images writes a :<version>, only promote moves :latest or GitHub's latest release,
# and :X.Y is never written: those tags stay at the last value the old pipeline gave them.
# finalize-images, npm and promote queue on one lock, sealant-release-channel. Re-running failed
# jobs is safe: every write first reads what is there (DEVELOPMENT.md, Releasing).
# A dispatch with dry_run is a dry run: version <packages/sdk version>-dryrun.<run id>.<attempt>,
# images built to archives and accepted from them (target archive), nothing pushed to any registry,
# and no job that publishes runs: none holds packages: write or an id-token. Only a tag push
# publishes, and every job that publishes refuses any version but its tag's plain X.Y.Z.
# Every job runs on a GitHub-hosted runner, a fresh VM: the box's runner VMs keep state between jobs.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, accept and check a release without publishing anything"
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  # The run's one version and where its images go. A tag push releases its tag to GHCR; a dispatch
  # is refused unless it is a dry run, whose version is derived here, never given: no input or
  # branch can name a real version's build. A dry run's target is archive: its images are built and
  # accepted from files, nothing is pushed to any registry, and no job that publishes runs.
  release:
    name: Choose what this run releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: packages/sdk/package.json
          sparse-checkout-cone-mode: false

      # tooling/scripts/release-publication.test.mjs runs this step as written.
      - name: Refuse anything but a tag push or a dry run, and choose the version
        id: resolve
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          plain='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          case $GITHUB_EVENT_NAME in
            push)
              if [[ $GITHUB_REF != refs/tags/v* ]]; then
                echo "::error::A release publishes from a vX.Y.Z tag push, not $GITHUB_REF."
                exit 1
              fi
              version=${GITHUB_REF_NAME#v}
              # The dry-run version is a dispatch's alone: as a tag it would build and push to GHCR.
              if [[ $version == *dryrun* ]]; then
                echo "::error::$GITHUB_REF_NAME is a dry-run version; a dry run is a dispatch, never a tag."
                exit 1
              fi
              target=ghcr
              ;;
            workflow_dispatch)
              if [[ $DRY_RUN != true ]]; then
                echo "::error::A dispatch only dry-runs a release: set dry_run. A release publishes from a tag push."
                exit 1
              fi
              # The SDK's committed version, which the next release takes once the Version Packages
              # pull request has merged, stamped with this run. Derived here, never an input.
              base=$(jq -r '.version // ""' packages/sdk/package.json)
              if [[ ! $base =~ $plain ]]; then
                echo "::error::packages/sdk/package.json gives '$base', not X.Y.Z; a dry run has no version."
                exit 1
              fi
              version=$base-dryrun.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT
              target=archive
              ;;
            *)
              echo "::error::$GITHUB_EVENT_NAME does not run a release."
              exit 1
              ;;
          esac
          case $GITHUB_EVENT_NAME/$target in
            push/ghcr | workflow_dispatch/archive) ;;
            *)
              echo "::error::A $GITHUB_EVENT_NAME never builds for $target."
              exit 1
              ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "target=$target" >>"$GITHUB_OUTPUT"
          echo "Release $version, images to $target."

  # Before anything builds or publishes: the tag is a stable vX.Y.Z (prereleases publish from main,
  # in next.yml), and no sealantd prerelease is pinned anywhere (ADR 0015 in sealant-sh/mend). A
  # dry run reports a sealantd prerelease instead, and every other check here still fails it.
  pins:
    name: Check what the release pins
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history: the prerelease check asks whether each next build's commit is an ancestor.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # --dry-run only for what the release job decided is a dry run: a dispatch, building to
      # archives, with the version it derived. The script then reports a sealantd prerelease as a
      # warning and in the run summary, and fails on everything else; a tag push never passes it,
      # so a vX.Y.Z tag refuses a sealantd prerelease. release-publication.test.mjs runs this step.
      - name: Refuse a prerelease tag or a prerelease sealantd
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TARGET: ${{ needs.release.outputs.target }}
        run: |
          set -euo pipefail
          flags=()
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            dryrun='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})-dryrun\.[1-9][0-9]*\.[1-9][0-9]*$'
            if [[ $TARGET != archive || ! $VERSION =~ $dryrun ]]; then
              echo "::error::A dispatch is a dry run: it builds to archives with a derived vX.Y.Z-dryrun.<run>.<attempt>, not '$VERSION' to $TARGET."
              exit 1
            fi
            flags+=(--dry-run)
          fi
          node tooling/scripts/check-release-pins.mjs "${flags[@]}" "v$VERSION"

      # One built from a commit this tag leaves out sorts below X.Y.Z but holds more: refuse. Main
      # is frozen from the Version Packages merge to this tag (sealant-sh/mend
      # docs/operations/next-channel.md); a merge during the freeze is what produces one.
      # A dry run checks the X.Y.Z it stamps, as that release would be checked.
      - name: Refuse a release that leaves out one of its next builds
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: >-
          node tooling/scripts/next-version.mjs --stray "v${VERSION%%-*}" --npm @sealant/sdk-next
          HEAD

      # An early exit only, before anything builds: the floor checks in promote, inside the release
      # channel's lock, are the guard.
      - name: Refuse a stable tag below the highest stable tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          version=$VERSION
          stable='^refs/tags/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
          highest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' |
            sed -nE "s#$stable#\\1#p" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          top=$(printf '%s\n' "$highest" "$version" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          if [[ -n $highest && $top != "$version" ]]; then
            echo "::error::v$version is below v$highest, the highest stable tag. A stable release never moves backwards, so a backport is refused on purpose."
            exit 1
          fi
          echo "v$version is not below the highest stable tag (${highest:+v}${highest:-none})."

  # Each image's platform on its own native runner, pushed to the stable repository by digest with
  # no tag at all: nothing pulls it until acceptance names it by that digest.
  build:
    name: Image (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    needs: [release, pins]
    if: needs.release.outputs.target == 'ghcr'
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: sealant-api, dockerfile: apps/api/Dockerfile }
          - { name: sealant-worker, dockerfile: apps/worker/Dockerfile }
          - { name: sealant-ssh-gateway, dockerfile: apps/ssh-gateway/Dockerfile }
          - { name: sealant-web, dockerfile: apps/web/Dockerfile }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # This job publishes, so it refuses anything but a plain X.Y.Z that is its own tag's, however
      # the version arrived: a dry run never publishes (sealant-sh/mend #1028: check the resolved
      # version, not the input). tooling/scripts/release-publication.test.mjs runs this step.
      - name: Refuse a version that is not this tag's release
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          plain='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          if [[ $GITHUB_EVENT_NAME != push || ! $VERSION =~ $plain || $GITHUB_REF_NAME != "v$VERSION" ]]; then
            echo "::error::'$VERSION' on a $GITHUB_EVENT_NAME of $GITHUB_REF_NAME is not a plain X.Y.Z release of its own tag. This job publishes; a dry run never does."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # BuildKit at a fixed digest: it runs privileged and performs the push.
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The web image must never receive VITE_API_URL at build time — the server reads
      # CORE_API_BASE_URL at runtime, and a baked VITE_ value would shadow it. The version label is
      # one of the stable floor's markers once promote moves :latest to this image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          outputs:
            type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name
            }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image.name }}--${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # A dry run's images, built as build builds them but exported to a file, never pushed. The docker
  # exporter, not oci: it writes the same OCI index.json and blobs and adds the manifest.json that
  # Docker's classic image store needs to load an archive. No attestations, so index.json names the
  # platform manifest itself, the digest acceptance checks.
  archive-build:
    name: Image archive (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    needs: [release, pins]
    if: needs.release.outputs.target == 'archive'
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: sealant-api, dockerfile: apps/api/Dockerfile }
          - { name: sealant-worker, dockerfile: apps/worker/Dockerfile }
          - { name: sealant-ssh-gateway, dockerfile: apps/ssh-gateway/Dockerfile }
          - { name: sealant-web, dockerfile: apps/web/Dockerfile }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # BuildKit at a fixed digest: it runs privileged.
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - run: mkdir -p "$RUNNER_TEMP/archive"

      - name: Build to an archive
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          outputs: type=docker,dest=${{ runner.temp }}/archive/${{ matrix.image.name }}.tar

      # The digest is computed from the archive itself and must be the one BuildKit reports, so the
      # manifest records what the file holds.
      - name: Record the platform digest from the archive
        env:
          ARCHIVE: ${{ runner.temp }}/archive/${{ matrix.image.name }}.tar
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          platform=$(node tooling/scripts/release-manifest.mjs archive-digest "$ARCHIVE")
          if [[ $platform != "$DIGEST" ]]; then
            echo "::error::The archive holds $platform; BuildKit reported '$DIGEST'."
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${platform#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image.name }}--${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # Layers are compressed already. They expire after a day.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-${{ matrix.image.name }}--${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/archive/${{ matrix.image.name }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Each image's two platforms as one index, under this run's own tag. :<version> is what every
  # install of the version pulls, so only finalize-images writes it, after acceptance.
  merge:
    name: Stage (${{ matrix.image }})
    needs: [release, build]
    if: needs.release.outputs.target == 'ghcr'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [sealant-api, sealant-worker, sealant-ssh-gateway, sealant-web]
    steps:
      # This job publishes, so it refuses anything but a plain X.Y.Z that is its own tag's, however
      # the version arrived: a dry run never publishes (sealant-sh/mend #1028: check the resolved
      # version, not the input). tooling/scripts/release-publication.test.mjs runs this step.
      - name: Refuse a version that is not this tag's release
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          plain='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          if [[ $GITHUB_EVENT_NAME != push || ! $VERSION =~ $plain || $GITHUB_REF_NAME != "v$VERSION" ]]; then
            echo "::error::'$VERSION' on a $GITHUB_EVENT_NAME of $GITHUB_REF_NAME is not a plain X.Y.Z release of its own tag. This job publishes; a dry run never does."
            exit 1
          fi

      # Only the index check, tooling/scripts/release-manifest.mjs.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tooling/scripts/release-manifest.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}--*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage the multi-arch index under this run's tag
        working-directory: /tmp/digests
        env:
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          tag=staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          sources=()
          for digest in *; do
            if [[ ! $digest =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::\"$digest\" in the digests artifact is not an image digest."
              exit 1
            fi
            sources+=("$REPOSITORY@sha256:$digest")
          done
          mkdir -p "$RUNNER_TEMP/index"
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index/create.json" \
            --tag "$REPOSITORY:$tag" "${sources[@]}"
          docker buildx imagetools inspect "$REPOSITORY:$tag"

      # The index digest goes in the release manifest: the one create reported, never the tag's,
      # which another writer can move. That index and each source are read by digest, and the index
      # must hold exactly the sources, for amd64 and arm64.
      - name: Check and record the index digest
        working-directory: ${{ runner.temp }}/index
        env:
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          digest=$(jq -r '."containerimage.digest" // ."containerimage.descriptor".digest // ""' create.json)
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::imagetools create reported no index digest."
            exit 1
          fi
          docker buildx imagetools inspect "$REPOSITORY@$digest" --raw >index.json
          sources=()
          for file in /tmp/digests/*; do
            source=${file##*/}
            docker buildx imagetools inspect "$REPOSITORY@sha256:$source" --raw >"source-$source.json"
            sources+=("sha256:$source=source-$source.json")
          done
          node "$GITHUB_WORKSPACE/tooling/scripts/release-manifest.mjs" check-index create.json \
            index.json "${sources[@]}" >digest

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: index-${{ matrix.image }}
          path: ${{ runner.temp }}/index/digest
          if-no-files-found: error
          retention-days: 1

  # The index merge makes, assembled in a registry that lives and dies with this job on loopback:
  # it proves both arches' archives make one index, and gives the manifest that index's digest.
  # Nothing leaves the runner.
  archive-merge:
    name: Assemble (${{ matrix.image }})
    needs: [release, archive-build]
    if: needs.release.outputs.target == 'archive'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [sealant-api, sealant-worker, sealant-ssh-gateway, sealant-web]
    steps:
      # Only the index check, tooling/scripts/release-manifest.mjs.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tooling/scripts/release-manifest.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/archives
          pattern: archive-${{ matrix.image }}--*

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}--*

      - name: Start a registry on loopback inside this job
        run: docker run --detach --name registry --publish 127.0.0.1:5000:5000 registry:2

      # The registry speaks plain HTTP on loopback; imagetools reads the builder's registry config.
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."127.0.0.1:5000"]
              http = true

      # skopeo keeps each manifest's bytes (--preserve-digests), so the registry holds the digest the
      # archive was recorded under; the inspect proves it.
      - name: Push both arches' archives to it
        env:
          IMAGE: ${{ matrix.image }}
          REPOSITORY: 127.0.0.1:5000/${{ matrix.image }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || {
            echo "::error::skopeo is missing from this runner image."
            exit 1
          }
          for arch in amd64 arm64; do
            digest=$(cd "/tmp/digests/digests-$IMAGE--$arch" && ls)
            skopeo copy --preserve-digests --dest-tls-verify=false \
              "oci-archive:/tmp/archives/archive-$IMAGE--$arch/$IMAGE.tar" "docker://$REPOSITORY:$arch"
            docker buildx imagetools inspect "$REPOSITORY@sha256:$digest" >/dev/null
          done

      - name: Create and inspect the multi-arch index in the job's registry
        env:
          IMAGE: ${{ matrix.image }}
          REPOSITORY: 127.0.0.1:5000/${{ matrix.image }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            sources+=("$REPOSITORY@sha256:$(cd "/tmp/digests/digests-$IMAGE--$arch" && ls)")
          done
          mkdir -p "$RUNNER_TEMP/index"
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index/create.json" \
            --tag "$REPOSITORY:$VERSION" "${sources[@]}"
          docker buildx imagetools inspect "$REPOSITORY:$VERSION"

      # As merge records it: the digest create reported, checked against the sources by digest.
      - name: Check and record the index digest
        working-directory: ${{ runner.temp }}/index
        env:
          IMAGE: ${{ matrix.image }}
          REPOSITORY: 127.0.0.1:5000/${{ matrix.image }}
        run: |
          set -euo pipefail
          digest=$(jq -r '."containerimage.digest" // ."containerimage.descriptor".digest // ""' create.json)
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::imagetools create reported no index digest."
            exit 1
          fi
          docker buildx imagetools inspect "$REPOSITORY@$digest" --raw >index.json
          sources=()
          for arch in amd64 arm64; do
            source=$(cd "/tmp/digests/digests-$IMAGE--$arch" && ls)
            docker buildx imagetools inspect "$REPOSITORY@sha256:$source" --raw >"source-$source.json"
            sources+=("sha256:$source=source-$source.json")
          done
          node "$GITHUB_WORKSPACE/tooling/scripts/release-manifest.mjs" check-index create.json \
            index.json "${sources[@]}" >digest

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: index-${{ matrix.image }}
          path: ${{ runner.temp }}/index/digest
          if-no-files-found: error
          retention-days: 1

  # Builds and packs the two packages with no credential: nothing this job runs, the dependencies'
  # build tools included, can reach the npm token. Each tarball is normalized once, checked as the
  # publisher will check it, and recorded in the release manifest by sha512; npm publishes exactly
  # these bytes. Kept 90 days, as the manifest is.
  pack:
    name: Pack the npm packages
    needs: [release, pins]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      records: ${{ steps.pack.outputs.records }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # No pnpm store cache: jobs running unowned code (next.yml's test and workspace-e2e,
      # kubernetes-e2e) write it, and pnpm links store files without re-hashing them. Node 24 for
      # the bundled npm's pacote, which the normalizer uses.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The git tag is the single version authority: both package.json versions come from it, and
      # the commit goes in as gitHead, which npm records and the publisher compares on a re-run.
      - name: Set the version and commit
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          for package in packages/api-contracts packages/sdk; do
            (cd "$package" && npm version "$VERSION" --no-git-tag-version --allow-same-version \
              && npm pkg set "gitHead=$GITHUB_SHA")
          done

      # `pnpm pack` does not run prepublishOnly, where both packages build: build first.
      - name: Build
        run: pnpm --filter "@sealant/api-contracts" --filter "@sealant/sdk" run build

      # pnpm pack turns the SDK's workspace:* dependency into this exact version and applies
      # publishConfig. The normalized tarball is checked again as the publisher checks it: already
      # normalized, never repacked.
      # A dry run's version is no release's: its tarballs are checked without the channel's shape.
      - name: Pack, normalize and record the tarballs
        id: pack
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TARGET: ${{ needs.release.outputs.target }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packed" "$RUNNER_TEMP/npm"
          for package in packages/api-contracts packages/sdk; do
            (cd "$package" && pnpm pack --pack-destination "$RUNNER_TEMP/packed")
          done
          # Every file each manifest exports is in its tarball, and nothing sits outside package/.
          node tooling/scripts/check-tarball.mjs "$RUNNER_TEMP"/packed/*.tgz
          records='{}'
          for name in @sealant/api-contracts @sealant/sdk; do
            file=${name#@}
            file="${file//\//-}-$VERSION.tgz"
            expected=(--name "$name" --version "$VERSION" --commit "$GITHUB_SHA")
            if [[ $TARGET == ghcr ]]; then expected+=(--channel latest); fi
            record=$(node tooling/scripts/normalize-npm-tarball.mjs "$RUNNER_TEMP/packed/$file" \
              --out "$RUNNER_TEMP/npm" "${expected[@]}")
            if [[ $(jq -r .file <<<"$record") != "$file" ]]; then
              echo "::error::$name packed as $(jq -r .file <<<"$record"), not $file."
              exit 1
            fi
            checked=$(node tooling/scripts/normalize-npm-tarball.mjs --check "$RUNNER_TEMP/npm/$file" \
              "${expected[@]}")
            if [[ $checked != "$record" ]]; then
              echo "::error::The normalized $file does not check as it was recorded."
              exit 1
            fi
            records=$(jq -c --arg name "$name" --argjson record "$record" '.[$name] = $record' <<<"$records")
          done
          node tooling/scripts/check-tarball.mjs "$RUNNER_TEMP"/npm/*.tgz
          echo "records=$records" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
          retention-days: 90

  # One record of what this run built: every image by its index and platform digests, and each npm
  # tarball by its sha512. Every later job reads it from this run and nowhere else. Kept 90 days, so
  # failed jobs can be re-run.
  release-manifest:
    name: Write the release manifest
    needs: [release, pins, merge, archive-merge, pack]
    # merge or archive-merge, by target; the other one is skipped.
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && needs.pins.result == 'success' &&
      needs.pack.result == 'success' && ((needs.release.outputs.target == 'ghcr' &&
      needs.merge.result == 'success') || (needs.release.outputs.target == 'archive' &&
      needs.archive-merge.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tooling/scripts/release-manifest.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # One directory per artifact, named for its image and arch.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/records/digests
          pattern: digests-*

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/records/indexes
          pattern: index-*

      - name: Write release-manifest.json
        env:
          VERSION: ${{ needs.release.outputs.version }}
          COMMIT: ${{ github.sha }}
          DIGESTS: ${{ runner.temp }}/records/digests
          INDEXES: ${{ runner.temp }}/records/indexes
          PACKAGES: ${{ needs.pack.outputs.records }}
        run: |
          mkdir -p "$RUNNER_TEMP/manifest"
          node tooling/scripts/release-manifest.mjs write "$RUNNER_TEMP/manifest/release-manifest.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest
          path: ${{ runner.temp }}/manifest/release-manifest.json
          if-no-files-found: error
          retention-days: 90

  # Run the real installer against this run's images on each arch: the stack must come up healthy
  # (API, web, SSH gateway) from a clean machine with only Docker, the contract users get.
  selfhost-smoke:
    name: Self-host install smoke (${{ matrix.platform.arch }})
    needs: [release, release-manifest]
    # A job whose if names no status function also needs every job above it to have succeeded, and
    # the other target's jobs above release-manifest are skipped: so the needs are checked by hand.
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && needs.release-manifest.result ==
      'success' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    # Pull ANONYMOUSLY, exactly like a user: GHCR authorizes GITHUB_TOKEN by package↔repo linkage
    # (not visibility), and logging in with it 403'd even on public packages during the v0.1.0
    # release. Anonymous pulls of public packages always work. Consequence: the first release of any
    # NEW image name fails here until its GHCR package is flipped public — flip it, then re-run the
    # failed jobs (`gh run rerun <id> --failed`).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release

      # install.sh runs any local image that carries the version's tag, and a tag can move. Pull
      # this arch's platform digest of each image from the manifest, record the ID it pulled as,
      # and tag only that ID with the name install.sh expects. :<version> does not exist on GHCR
      # yet, so install.sh's own pulls of it fail harmlessly and the local tags stand.
      - name: Pull this run's images by digest
        if: needs.release.outputs.target == 'ghcr'
        env:
          NAMESPACE: ghcr.io/${{ github.repository_owner }}
          MANIFEST: ${{ runner.temp }}/release/release-manifest.json
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: ${{ matrix.platform.arch }}
          IDS: ${{ runner.temp }}/image-ids
        run: |
          set -euo pipefail
          case $RUNNER_ARCH in
            X64) arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::No image is built for $RUNNER_ARCH."; exit 1 ;;
          esac
          if [[ $arch != "$ARCH" ]]; then
            echo "::error::This $arch runner was asked to accept $ARCH."
            exit 1
          fi
          : >"$IDS"
          for image in sealant-api sealant-worker sealant-ssh-gateway sealant-web; do
            digest=$(node tooling/scripts/release-manifest.mjs digest "$MANIFEST" "$image" "$arch")
            docker pull "$NAMESPACE/$image@$digest"
            id=$(docker image inspect "$NAMESPACE/$image@$digest" --format '{{.Id}}')
            docker tag "$id" "$NAMESPACE/$image:$VERSION"
            echo "$image $id" >>"$IDS"
          done

      # A dry run's archives of this arch, each checked against the manifest before Docker sees it.
      # The image ID is then the config digest of that manifest (the manifest digest itself on
      # Docker's containerd image store); the loaded image must be one of them, and only that ID is
      # tagged with the name install.sh expects.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.release.outputs.target == 'archive'
        with:
          path: ${{ runner.temp }}/archives
          pattern: archive-*--${{ matrix.platform.arch }}

      - name: Load this run's images from their archives
        if: needs.release.outputs.target == 'archive'
        env:
          NAMESPACE: ghcr.io/${{ github.repository_owner }}
          MANIFEST: ${{ runner.temp }}/release/release-manifest.json
          VERSION: ${{ needs.release.outputs.version }}
          ARCH: ${{ matrix.platform.arch }}
          IDS: ${{ runner.temp }}/image-ids
        run: |
          set -euo pipefail
          : >"$IDS"
          for image in sealant-api sealant-worker sealant-ssh-gateway sealant-web; do
            archive=$RUNNER_TEMP/archives/archive-$image--$ARCH/$image.tar
            ids=$(node tooling/scripts/release-manifest.mjs check-archive "$MANIFEST" "$image" "$ARCH" "$archive")
            docker load --input "$archive"
            id=
            for candidate in $ids; do
              if [[ $(docker image inspect "$candidate" --format '{{.Id}}' 2>/dev/null) == "$candidate" ]]; then
                id=$candidate
                break
              fi
            done
            if [[ -z $id ]]; then
              echo "::error::$image did not load as its config digest or its manifest digest ($ids)."
              exit 1
            fi
            docker tag "$id" "$NAMESPACE/$image:$VERSION"
            echo "$image $id" >>"$IDS"
          done

      - name: Run installer against this run's images
        env:
          SEALANT_VERSION: ${{ needs.release.outputs.version }}
          SEALANT_IMAGE_NS: ghcr.io/${{ github.repository_owner }}
          SEALANT_COMPOSE_URL: ${{ github.workspace }}/compose.selfhost.yaml
        # compose version first: the runner's compose behaved differently from local ones during the
        # v0.1.x releases — keep it in the logs for debugging.
        run: |
          docker compose version
          sh install.sh

      - name: Assert SSH gateway is listening
        run: |
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then exec 3>&-; echo "gateway up"; exit 0; fi
            sleep 2
          done
          echo "gateway did not come up" >&2
          docker compose --project-directory ~/.config/sealant logs ssh-gateway >&2
          exit 1

      # A healthy stack proves nothing about these images unless it ran them: each product service's
      # container must run the image ID pulled by digest above, under the name install.sh gave it,
      # labelled with this version.
      - name: Assert each service runs the image pulled by digest
        env:
          NAMESPACE: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ needs.release.outputs.version }}
          IDS: ${{ runner.temp }}/image-ids
        run: |
          set -euo pipefail
          declare -A pulled
          while read -r image id; do pulled[$image]=$id; done <"$IDS"
          failed=0
          for entry in api:sealant-api worker:sealant-worker ssh-gateway:sealant-ssh-gateway web:sealant-web; do
            service=${entry%%:*} image=${entry#*:}
            if [[ ! ${pulled[$image]:-} =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No image ID was recorded for $image."
              exit 1
            fi
            containers=$(docker compose --project-directory ~/.config/sealant ps --quiet "$service")
            if [[ $(wc -w <<<"$containers") -ne 1 ]]; then
              echo "::error::$service runs $(wc -w <<<"$containers") containers, not one."
              failed=1
              continue
            fi
            read -r running name <<<"$(docker inspect "$containers" --format '{{.Image}} {{.Config.Image}}')"
            label=$(docker image inspect "$running" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
            if [[ $running != "${pulled[$image]}" || $name != "$NAMESPACE/$image:$VERSION" || $label != "$VERSION" ]]; then
              echo "::error::$service runs $running ($name, version $label), not ${pulled[$image]} ($NAMESPACE/$image:$VERSION, version $VERSION), the image pulled by digest."
              failed=1
              continue
            fi
            echo "$service runs $running, $image as pulled by digest."
          done
          exit "$failed"

      - name: Dump logs on failure
        if: failure()
        run: docker compose --project-directory ~/.config/sealant logs

  # Prove the workspace runtime contract against the PINNED sealantd image before anything
  # publishes: build the baked fedora workspace image (which pulls the exact
  # ghcr.io/sealant-sh/sealantd pin from buildkit-builder.ts), then run the sealantd e2e suite in
  # required mode — an absent image FAILS the job instead of skipping the specs. A daemon/pin
  # mismatch (e.g. env inheritance drift) stops the release here rather than shipping an SDK whose
  # documented behavior the runtime does not honor.
  workspace-e2e:
    name: Workspace runtime e2e (pinned sealantd)
    needs: pins
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # No pnpm store cache: other jobs, running unowned code, write that cache.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the baked workspace image (pulls the pinned sealantd)
        run:
          DOCKER_BUILDKIT=1 pnpm --filter @sealant/workspaces exec tsx
          scripts/sealantd-build-image.mts

      - name: Run sealantd e2e suite (image required, never skipped)
        env:
          SEALANT_E2E_REQUIRE_IMAGE: "1"
        run: pnpm --filter @sealant/workspaces test:e2e src/sealantd

      - name: Containerized launcher and real workspace volume test
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/runtime/docker-volume-mounts.e2e.ts

      - name: Capture owner map through the Docker adapter and a real daemon (never skipped)
        env:
          SEALANT_E2E_REQUIRE_IMAGE: "1"
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/runtime/capture-owner-map.e2e.ts

      - name: Dotfiles as a person, and pi/opencode logins in a person's home (never skipped)
        env:
          SEALANT_E2E_REQUIRE_IMAGE: "1"
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/runtime/dotfiles-apply.e2e.ts
          src/runtime/home-credentials.e2e.ts

      - name: Executions and sessions as a person, and a sealantd without exec.user (never skipped)
        env:
          SEALANT_E2E_REQUIRE_IMAGE: "1"
        run: pnpm --filter @sealant/workspaces test:e2e src/runtime/process-user.e2e.ts

      - name: SSH sessions as the workspace's user through the gateway (never skipped)
        env:
          SEALANT_E2E_REQUIRE_IMAGE: "1"
        run: pnpm --filter @sealant/ssh-gateway test:e2e

  # Everything that publishes waits for this: the smoke on both arches and the workspace e2e.
  acceptance:
    name: Check this run's acceptance passed
    needs: [release, selfhost-smoke, workspace-e2e]
    # Runs whatever the smoke and the e2e did, so a skipped smoke fails here instead of skipping.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse unless every acceptance passed
        env:
          SMOKE: ${{ needs.selfhost-smoke.result }}
          WORKSPACE: ${{ needs.workspace-e2e.result }}
        run: |
          if [[ $SMOKE != success || $WORKSPACE != success ]]; then
            echo "::error::The self-host smoke is '$SMOKE' and the workspace e2e '$WORKSPACE'; both must pass. Nothing publishes."
            exit 1
          fi
          echo "The self-host smoke passed on amd64 and arm64, and the workspace e2e passed."

  # Writes each image's :<version>, once, from the index digest this run accepted. A version is
  # spent once its tag exists: re-running failed jobs finds it at this run's digest and is done,
  # re-running all jobs builds another index and is refused.
  finalize-images:
    name: Publish the accepted images under their version
    needs: [release, acceptance]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.release.result == 'success' &&
      needs.acceptance.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # The release channel's lock: this job queues behind any other run's finalize, npm or promote,
    # never cancelled. Each job is serialized on its own; the lock is not held across a whole
    # release, so promote re-reads the floor inside it. Job-level `queue: max` holds every pending
    # job instead of only the newest (proven in sealant-sh/mend runs 38897026470, 38897041709 and
    # 38897056028). actionlint does not know `queue` yet; .github/actionlint.yaml ignores it here.
    concurrency:
      group: sealant-release-channel
      cancel-in-progress: false
      queue: max
    steps:
      # This job publishes, so it refuses anything but a plain X.Y.Z that is its own tag's, however
      # the version arrived: a dry run never publishes (sealant-sh/mend #1028: check the resolved
      # version, not the input). tooling/scripts/release-publication.test.mjs runs this step.
      - name: Refuse a version that is not this tag's release
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          plain='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          if [[ $GITHUB_EVENT_NAME != push || ! $VERSION =~ $plain || $GITHUB_REF_NAME != "v$VERSION" ]]; then
            echo "::error::'$VERSION' on a $GITHUB_EVENT_NAME of $GITHUB_REF_NAME is not a plain X.Y.Z release of its own tag. This job publishes; a dry run never does."
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest
          path: release

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every tag is read before any is written, and the read after the write decides: a create
      # that reports an error but left this run's digest is done, any other digest is refused, and
      # a tag still unreadable fails.
      # tooling/scripts/release-publication.test.mjs runs this step as written, against a stand-in docker.
      - name: Publish each accepted index as its version
        env:
          MANIFEST: ${{ github.workspace }}/release/release-manifest.json
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if ! jq -e --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '.version == $version and .commit == $commit' "$MANIFEST" >/dev/null; then
            echo "::error::The release manifest is not this release's ($VERSION from $GITHUB_SHA)."
            exit 1
          fi
          # The digest <ref> names, `absent` when the registry says it does not exist, and a
          # failure for anything else: a read that failed is never taken for an absent tag. Absent
          # is buildx's not-found line and nothing else: all of stderr, its trailing newlines aside,
          # is exactly `ERROR: <ref>: not found`, and stdout is empty.
          read_tag() {
            local out err status=0 digest
            out=$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' \
              2>"$RUNNER_TEMP/inspect.err") || status=$?
            if ((status == 0)); then
              digest=$(jq -r '.digest // ""' <<<"$out")
              if [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '%s\n' "$digest"
                return 0
              fi
              echo "::error::$1 answered without a digest." >&2
              return 1
            fi
            err=$(<"$RUNNER_TEMP/inspect.err")
            if [[ -z $out && $err == "ERROR: $1: not found" ]]; then
              echo absent
              return 0
            fi
            cat "$RUNNER_TEMP/inspect.err" >&2
            echo "::error::Could not read $1; nothing was written." >&2
            return 1
          }
          images=(sealant-api sealant-worker sealant-ssh-gateway sealant-web)
          declare -A index create
          for image in "${images[@]}"; do
            repository="ghcr.io/$GITHUB_REPOSITORY_OWNER/$image"
            index[$image]=$(jq -r --arg image "$image" '.images[$image].index // ""' "$MANIFEST")
            if [[ ! ${index[$image]} =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The release manifest records no index digest for $image."
              exit 1
            fi
            current=$(read_tag "$repository:$VERSION")
            if [[ $current == absent ]]; then
              create[$image]=1
            elif [[ $current == "${index[$image]}" ]]; then
              echo "$repository:$VERSION is already this run's ${index[$image]}."
            else
              echo "::error::$repository:$VERSION exists at $current, not ${index[$image]}, the index this run accepted. Version $VERSION is spent: cut a new one."
              exit 1
            fi
          done
          for image in "${images[@]}"; do
            [[ -n ${create[$image]:-} ]] || continue
            repository="ghcr.io/$GITHUB_REPOSITORY_OWNER/$image"
            status=0
            docker buildx imagetools create --tag "$repository:$VERSION" \
              "$repository@${index[$image]}" || status=$?
            if ! after=$(read_tag "$repository:$VERSION"); then
              echo "::error::$repository:$VERSION is unreadable after the create (exit $status)."
              exit 1
            fi
            if [[ $after == "${index[$image]}" ]]; then
              if ((status != 0)); then
                echo "::warning::The create reported exit $status, but $repository:$VERSION resolves to ${index[$image]}, the index this run accepted."
              fi
              echo "$repository:$VERSION is ${index[$image]}."
            elif [[ $after == absent ]]; then
              echo "::error::$repository:$VERSION does not exist after the create (exit $status)."
              exit 1
            else
              echo "::error::$repository:$VERSION resolves to $after after the create, not ${index[$image]}. Version $VERSION is spent: cut a new one."
              exit 1
            fi
          done
          {
            echo "## Sealant $VERSION"
            echo
            for image in "${images[@]}"; do
              echo "- \`ghcr.io/$GITHUB_REPOSITORY_OWNER/$image:$VERSION\` (\`${index[$image]}\`)"
            done
          } >>"$GITHUB_STEP_SUMMARY"

  # Holds the npm credential and runs nothing from the repository: no checkout, no install, no
  # build. It publishes exactly the tarballs the pack job made and the release manifest records,
  # after this run's acceptance passed and every :<version> exists, so an SDK release never exists
  # without its four images.
  npm:
    name: Publish npm packages
    needs: [release, acceptance, finalize-images]
    # A tag push only: on a dry run this job is skipped, so it asks for no environment and no id-token.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.release.result == 'success' &&
      needs.acceptance.result == 'success' && needs.finalize-images.result == 'success' }}
    # The release channel's lock, as finalize-images holds it. The floor is read inside it.
    concurrency:
      group: sealant-release-channel
      cancel-in-progress: false
      queue: max
    # npm trusted publishing (OIDC) needs a GitHub-hosted runner, where GitHub mints the id-token.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment: configure required reviewers on `release` in repo settings, and
    # register both packages' npm Trusted Publishers against this repo + release.yml + this
    # environment. (The very first publish of a brand-new package name must be done manually with
    # an npm token/OTP — trusted publishing attaches to an existing package.)
    environment: release
    permissions:
      id-token: write
    steps:
      # This job publishes, so it refuses anything but a plain X.Y.Z that is its own tag's, however
      # the version arrived: a dry run never publishes (sealant-sh/mend #1028: check the resolved
      # version, not the input). tooling/scripts/release-publication.test.mjs runs this step.
      - name: Refuse a version that is not this tag's release
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          plain='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          if [[ $GITHUB_EVENT_NAME != push || ! $VERSION =~ $plain || $GITHUB_REF_NAME != "v$VERSION" ]]; then
            echo "::error::'$VERSION' on a $GITHUB_EVENT_NAME of $GITHUB_REF_NAME is not a plain X.Y.Z release of its own tag. This job publishes; a dry run never does."
            exit 1
          fi

      # Node 24, NOT 22: trusted publishing needs the bundled npm >= 11.5 (node 22 ships npm 10,
      # which silently skips the OIDC exchange and the registry 404s the anonymous publish). Its
      # pacote is what the inline check uses.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Both from this run: the tarballs the pack job made, and the manifest that records them.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs
          path: npm

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest
          path: release

      # The floor is read here, inside the lock: a newer release may have published while this run
      # waited. Above it both packages publish; at it (a retry) nothing is republished and no
      # dist-tag moves; below it nothing publishes.
      # tooling/scripts/release-npm.test.mjs runs this step as written, against a stub npm registry,
      # a stub GitHub API and a stand-in docker.
      - name: Publish to npm
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # Retried reads wait 1500 ms × attempt (registry_get, github_latest_release). Only a test sets
          # RELEASE_TEST_RETRY_MS, never a workflow; the log says which delays this run used.
          if [[ -z ${RELEASE_TEST_RETRY_MS:-} ]]; then
            echo "retry backoff: production (1500 ms × attempt)"
          elif [[ $RELEASE_TEST_RETRY_MS =~ ^(0|[1-9][0-9]{0,5})$ ]]; then
            echo "retry backoff: overridden to $RELEASE_TEST_RETRY_MS ms × attempt"
          else
            echo "::error::RELEASE_TEST_RETRY_MS is not a whole number of milliseconds."
            exit 1
          fi
          # The integrity read-back waits 5 s × attempt (published_integrity). Only a test sets
          # REPUBLISH_TEST_WAIT, never a workflow.
          if [[ -z ${REPUBLISH_TEST_WAIT:-} ]]; then
            echo "integrity read-back wait: production (5 s × attempt)"
          elif [[ $REPUBLISH_TEST_WAIT =~ ^(0|[1-9][0-9]{0,3})$ ]]; then
            echo "integrity read-back wait: overridden to $REPUBLISH_TEST_WAIT s × attempt"
          else
            echo "::error::REPUBLISH_TEST_WAIT is not a whole number of seconds."
            exit 1
          fi
          # --- floor ---
          # release-publication.test.mjs runs this block as written, against a stub npm registry, a stub
          # GitHub API and a stand-in docker. A stable release's floor is the highest of its markers, compared
          # as numbers X.Y.Z: npm's `latest` for each of FLOOR_PACKAGES, the tag of GitHub's latest release,
          # and the org.opencontainers.image.version label on every platform of each ghcr :latest in
          # FLOOR_IMAGES. A marker that does not exist adds nothing; one that cannot be read, or is present
          # but not a plain X.Y.Z, fails the job: never read as no floor. Each reader validates the whole value
          # it read before it is compared or joined to its source. A part of X.Y.Z has at most 9 digits, so
          # Bash's 64-bit arithmetic compares every version this accepts; a longer part fails as not plain.
          # :X.Y tags are not markers: nothing writes them.
          shopt -s inherit_errexit
          PLAIN_VERSION='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          FLOOR_PACKAGES=(@sealant/api-contracts @sealant/sdk)
          FLOOR_IMAGES=(sealant-api sealant-worker sealant-ssh-gateway sealant-web)

          # GET <path> from the registry, retried; a failure or a 404 stops the job: never guessed.
          registry_get() {
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [where, registry] = process.argv.slice(1);
              const url = new URL(where, registry.endsWith("/") ? registry : `${registry}/`);
              const run = async () => {
                for (let attempt = 1; attempt <= 4; attempt += 1) {
                  try {
                    const response = await fetch(url, { headers: { accept: "application/json" } });
                    if (response.ok) return process.stdout.write(JSON.stringify(await response.json()));
                    if (attempt === 4) throw new Error(`the registry answered ${response.status} for ${where}`);
                  } catch (error) {
                    if (attempt === 4) {
                      console.error(`::error::${error.message}`);
                      process.exit(1);
                    }
                  }
                  await new Promise((resolve) => setTimeout(resolve, attempt * Number(process.env.RELEASE_TEST_RETRY_MS || 1500)));
                }
              };
              run();
            ' -- "$1" "$(npm config get registry)"
          }

          # <value> is a plain X.Y.Z (each part at most 9 digits), or the job fails naming <marker>.
          plain_version() {
            if [[ ! $1 =~ $PLAIN_VERSION ]]; then
              echo "::error::$2 is '$1', not a plain X.Y.Z release; the floor cannot be read." >&2
              return 1
            fi
          }

          # npm's `latest` for <package>, validated, or nothing when the package has no `latest` dist-tag. The
          # answer must be a JSON object; a `latest` that is null, empty, not a string or not a plain X.Y.Z fails.
          npm_latest() {
            local tags
            tags=$(registry_get "-/package/${1/\//%2f}/dist-tags")
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [plain, what] = process.argv.slice(1);
              const fail = (why) => {
                console.error(`::error::${what} ${why}; the floor cannot be read.`);
                process.exit(1);
              };
              let tags;
              try {
                tags = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              } catch {
                fail("is not JSON");
              }
              if (tags === null || typeof tags !== "object" || Array.isArray(tags)) fail("is not a JSON object");
              if (!Object.hasOwn(tags, "latest")) process.exit(0);
              if (typeof tags.latest !== "string" || !new RegExp(plain).test(tags.latest))
                fail(`latest is ${JSON.stringify(tags.latest)}, not a plain X.Y.Z release`);
              process.stdout.write(tags.latest);
            ' "$PLAIN_VERSION" "npm:$1 dist-tags" <<<"$tags"
          }

          # -1, 0 or 1 as plain X.Y.Z <a> is below, equal to or above <b>.
          version_order() {
            local a b i
            IFS=. read -r -a a <<<"$1"
            IFS=. read -r -a b <<<"$2"
            for i in 0 1 2; do
              if ((10#${a[i]} < 10#${b[i]})); then echo -1 && return; fi
              if ((10#${a[i]} > 10#${b[i]})); then echo 1 && return; fi
            done
            echo 0
          }

          # The tag of the repository's latest GitHub release, without its v, or nothing when it has none: only
          # a 404 is none. A tag that is not exactly vX.Y.Z fails; other answers are retried, then fail.
          github_latest_release() {
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [api, repository, token, plain] = process.argv.slice(1);
              const url = `${api}/repos/${repository}/releases/latest`;
              const headers = { accept: "application/vnd.github+json", "x-github-api-version": "2022-11-28" };
              if (token) headers.authorization = `Bearer ${token}`;
              const run = async () => {
                for (let attempt = 1; attempt <= 4; attempt += 1) {
                  try {
                    const response = await fetch(url, { headers });
                    if (response.status === 404) return;
                    if (response.ok) {
                      const tag = (await response.json())?.tag_name;
                      if (typeof tag !== "string" || !tag.startsWith("v") || !new RegExp(plain).test(tag.slice(1)))
                        throw new Error(`the latest release is tagged ${JSON.stringify(tag)}, not vX.Y.Z`);
                      return process.stdout.write(tag.slice(1));
                    }
                    if (attempt === 4) throw new Error(`GitHub answered ${response.status} for ${url}`);
                  } catch (error) {
                    if (attempt === 4 || error.message.startsWith("the latest release")) {
                      console.error(`::error::${error.message}`);
                      process.exit(1);
                    }
                  }
                  await new Promise((resolve) => setTimeout(resolve, attempt * Number(process.env.RELEASE_TEST_RETRY_MS || 1500)));
                }
              };
              run();
            ' -- "${GITHUB_API_URL:-https://api.github.com}" "$GITHUB_REPOSITORY" "${GH_TOKEN:-}" "$PLAIN_VERSION"
          }

          # Reads <ref> with `imagetools inspect --format <format>` into stdout, prints nothing for a tag that
          # does not exist, and fails on anything else. Absent is buildx's not-found line and nothing else:
          # all of stderr, trailing newlines aside, is exactly `ERROR: <ref>: not found`, and stdout is empty.
          inspect_ref() {
            local out err status=0 errors
            errors=$(mktemp)
            out=$(docker buildx imagetools inspect "$1" --format "$2" 2>"$errors") || status=$?
            err=$(<"$errors")
            rm -f "$errors"
            if ((status == 0)) && [[ -n $out ]]; then
              printf '%s\n' "$out"
              return 0
            fi
            if ((status != 0)) && [[ -z $out && $err == "ERROR: $1: not found" ]]; then return 0; fi
            printf '%s\n' "$err" >&2
            echo "::error::Could not read $1; nothing was written." >&2
            return 1
          }

          # The digest <ref> names, or nothing when it does not exist.
          tag_digest() {
            local out digest
            out=$(inspect_ref "$1" '{{json .Manifest}}')
            [[ -n $out ]] || return 0
            digest=$(jq -r '.digest // ""' <<<"$out")
            if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$1 answered without a digest." >&2
              return 1
            fi
            printf '%s\n' "$digest"
          }

          # The org.opencontainers.image.version every platform of <ref> carries, or nothing when <ref> does
          # not exist. Each platform's label must be the whole string X.Y.Z, and all must be the same.
          image_version() {
            local out
            out=$(inspect_ref "$1" '{{json .Image}}')
            [[ -n $out ]] || return 0
            # One platform answers its config; an index answers each platform's config by platform.
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [plain, ref] = process.argv.slice(1);
              const fail = (why) => {
                console.error(`::error::${ref} ${why}; the floor cannot be read.`);
                process.exit(1);
              };
              let image;
              try {
                image = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              } catch {
                fail("answered an image config that is not JSON");
              }
              if (image === null || typeof image !== "object" || Array.isArray(image)) fail("answered no image config");
              const configs = Object.hasOwn(image, "config") ? [image] : Object.values(image);
              if (configs.length === 0) fail("answered no platform");
              const labels = configs.map((config) => config?.config?.Labels?.["org.opencontainers.image.version"]);
              const bad = labels.some((label) => typeof label !== "string" || !new RegExp(plain).test(label));
              if (bad || labels.some((label) => label !== labels[0]))
                fail(`carries no single plain X.Y.Z org.opencontainers.image.version (${labels.map((label) => JSON.stringify(label ?? null)).join(", ")})`);
              process.stdout.write(labels[0]);
            ' "$PLAIN_VERSION" "$1" <<<"$out"
          }

          # The floor of a stable release whose images are ghcr.io/<owner>/<FLOOR_IMAGES>: `<version> <marker>`
          # of the highest marker, or nothing when none exists. Every version here was validated by its reader;
          # versions and markers are kept apart until the result is printed.
          stable_floor() {
            local owner=$1 value package image i best=-1
            local -a versions=() sources=()
            for package in "${FLOOR_PACKAGES[@]}"; do
              value=$(npm_latest "$package")
              if [[ -n $value ]]; then versions+=("$value") && sources+=("npm:$package@latest"); fi
            done
            value=$(github_latest_release)
            if [[ -n $value ]]; then versions+=("$value") && sources+=("github:$GITHUB_REPOSITORY/releases/latest"); fi
            for image in "${FLOOR_IMAGES[@]}"; do
              value=$(image_version "ghcr.io/$owner/$image:latest")
              if [[ -n $value ]]; then versions+=("$value") && sources+=("ghcr.io/$owner/$image:latest"); fi
            done
            for i in "${!versions[@]}"; do
              plain_version "${versions[i]}" "${sources[i]}"
              if ((best < 0)) || [[ $(version_order "${versions[i]}" "${versions[best]}") == 1 ]]; then best=$i; fi
            done
            if ((best >= 0)); then printf '%s %s\n' "${versions[best]}" "${sources[best]}"; fi
          }

          # What a stable <version> may do against the floor line `<floor> <marker>` (empty: no floor):
          # `publish` above it, `retry` at it, and a refusal below it.
          stable_guard() {
            local version=$1 floor=${2%% *} marker=${2#* }
            plain_version "$version" "the release"
            if [[ -z $2 ]]; then
              echo publish
              return
            fi
            plain_version "$floor" "$marker"
            case $(version_order "$version" "$floor") in
              1) echo publish ;;
              0) echo retry ;;
              *)
                echo "::error::$version is below the stable floor $floor ($marker). A stable release never moves npm latest, ghcr :latest or GitHub's latest release backwards, so a backport such as 0.38.2 after 0.39.0 is refused on purpose: publishing one under its own dist-tag is a decision not yet made. Nothing was published or moved." >&2
                return 1
                ;;
            esac
          }
          # --- end floor ---
          # --- republish ---
          # release-npm.test.mjs runs this block as written, against a stub registry. publish_release checks
          # the downloaded artifact directories first (check_artifacts), then runs every npm command from a
          # fresh empty directory, so no .npmrc in or near an artifact can configure npm. What publishes is the
          # run's own tarballs, byte for byte: the pack job packed and normalized them once, and the run's
          # release manifest records each one's sha512 and integrity. Nothing repacks them. Each is refused
          # unless the manifest is this release's and its sha512 is the file's, and unless npm's own copy of
          # pacote (no install, nothing unpinned loads), extracting it, finds it already normalized: only
          # allowlisted manifest fields (no `tag`, no scripts, no publishConfig but `access`), the expected
          # name, version, channel and commit, no alias dependency, a sibling at exactly this version, no root
          # binding.gyp (npm would add an install script for it) and no .npmrc. That is
          # tooling/scripts/normalize-npm-tarball.mjs --check, written out here because this job runs no
          # repository file; release-npm.test.mjs holds the two to the same answers. Both tarballs are checked
          # before either is published. The registry's dist.integrity must then be the manifest's.
          # Failures inside $(...) stop the job too. Registry and npm JSON reaches node on stdin, never as an
          # argument: Linux refuses one argument over 128 KB, and a package document outgrows that.
          shopt -s inherit_errexit
          KEEP_FIELDS='["name","version","description","license","repository","homepage","bugs","keywords","type","main","module","types","typings","exports","files","bin","man","directories","engines","dependencies","peerDependencies","peerDependenciesMeta","optionalDependencies","gitHead"]'

          # The artifact directory <dir> holds exactly the expected files (regular files), nothing else.
          check_artifacts() {
            local dir=$1 extra expected
            shift
            extra=$(cd "$dir" && find . -mindepth 1 | sed 's|^\./||' | grep -vxF -f <(printf '%s\n' "$@") || true)
            if [[ -n $extra ]]; then
              echo "::error::The artifact holds more than the expected tarballs: $(tr '\n' ' ' <<<"$extra")"
              return 1
            fi
            for expected in "$@"; do
              if [[ ! -f $dir/$expected || -L $dir/$expected ]]; then
                echo "::error::$expected is missing from the artifact, or is not a regular file."
                return 1
              fi
            done
          }

          # registry_get comes from the floor block above.

          # The commit a published version came from ("unknown" without gitHead), or nothing if unpublished.
          published_from() {
            local record
            record=$(registry_get "${1/\//%2f}")
            node -e '
              const found = JSON.parse(require("node:fs").readFileSync(0, "utf8")).versions?.[process.argv[1]];
              process.stdout.write(found === undefined ? "" : String(found.gitHead ?? "unknown"));
            ' "$2" <<<"$record"
          }

          # The integrity the release manifest <manifest> records for <tarball> of <name>, once the manifest is
          # this release's (<version>, <commit>), names the tarball's file, and records its sha512 and integrity.
          recorded_integrity() {
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const [tarball, file, name, version, commit] = process.argv.slice(1);
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              const entry = manifest.packages?.[name] ?? {};
              const digest = require("node:crypto").createHash("sha512").update(fs.readFileSync(tarball)).digest();
              const integrity = `sha512-${digest.toString("base64")}`;
              const problems = [
                manifest.version !== version && `the release manifest is for ${manifest.version}, not ${version}`,
                manifest.commit !== commit && `the release manifest is from ${manifest.commit}, not ${commit}`,
                entry.file !== path.basename(tarball) && `the release manifest names ${entry.file} for ${name}, not ${path.basename(tarball)}`,
                entry.sha512 !== digest.toString("hex") && `${path.basename(tarball)} has another sha512 than the release manifest records`,
                entry.integrity !== integrity && `the release manifest records integrity ${entry.integrity}, not ${integrity}`,
              ].filter(Boolean);
              if (problems.length > 0) {
                console.error(`::error::${problems.join("; ")}. Nothing was published.`);
                process.exit(1);
              }
              process.stdout.write(integrity);
            ' "$1" "$2" "$3" "$4" "$5"
          }

          # Refuses <tarball> unless pacote, extracting it, finds it already published-ready as <name>@<version>
          # from <commit> under <channel>. It never rewrites or repacks it.
          check_tarball() {
            local tarball=$1 name=$2 version=$3 commit=$4 channel=$5 work pacote status=0
            pacote=${REPUBLISH_TEST_PACOTE:-$(npm root -g)/npm/node_modules/pacote}
            work=$(mktemp -d)
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const { isDeepStrictEqual } = require("node:util");
              const [pacotePath, tarball, dir, name, version, commit, channel, keepText] = process.argv.slice(1);
              const pacote = require(pacotePath);
              const releasedTogether = ["@sealant/api-contracts", "@sealant/sdk"];
              const run = async () => {
                await pacote.extract(`file:${path.resolve(tarball)}`, dir);
                const read = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8"));
                const normalized = {};
                for (const field of JSON.parse(keepText)) if (field in read) normalized[field] = read[field];
                if (read.publishConfig?.access !== undefined) normalized.publishConfig = { access: read.publishConfig.access };
                const shape = channel === "next" ? /^\d+\.\d+\.\d+-next\.\d+$/ : /^\d+\.\d+\.\d+$/;
                // A -next package depends on its siblings only as `npm:@sealant/<sibling>-next@<this version>`;
                // anything else (and any alias at all outside the -next packages) is refused. Outside them, a
                // package released together with this one is depended on at exactly this version.
                const isNextPackage = /^@sealant\/[a-z0-9-]+-next$/.test(String(read.name));
                const dependencyProblems = ["dependencies", "peerDependencies", "optionalDependencies"].flatMap(
                  (field) =>
                    Object.entries(read[field] ?? {}).flatMap(([dependency, spec]) => {
                      const alias = String(spec).startsWith("npm:");
                      if (!dependency.startsWith("@sealant/")) {
                        return alias ? [`${dependency} is an alias (${spec})`] : [];
                      }
                      const expected = `npm:${dependency}-next@${version}`;
                      if (isNextPackage) return spec === expected ? [] : [`${dependency}@${spec}, not ${expected}`];
                      if (alias) return [`${dependency} is an alias (${spec})`];
                      return releasedTogether.includes(dependency) && spec !== version ? [`${dependency}@${spec}, not ${version}`] : [];
                    }),
                );
                const extra = Object.keys(read).filter((field) => !(field in normalized));
                const npmrc = fs
                  .readdirSync(dir, { recursive: true, withFileTypes: true })
                  .filter((entry) => entry.name === ".npmrc")
                  .map((entry) => path.relative(dir, path.join(entry.parentPath, entry.name)));
                const problems = [
                  channel === "next" && !isNextPackage && `${read.name} is not a -next package`,
                  ...dependencyProblems,
                  read.name !== name && `name ${read.name}, not ${name}`,
                  read.version !== version && `version ${read.version}, not ${version}`,
                  !shape.test(String(read.version)) && `${read.version} is not a ${channel} version`,
                  read.gitHead !== commit && `gitHead ${read.gitHead}, not ${commit}`,
                  fs.existsSync(path.join(dir, "binding.gyp")) && "a binding.gyp, which npm turns into an install script",
                  extra.length > 0 && `not normalized: it keeps ${extra.join(", ")}`,
                  extra.length === 0 && !isDeepStrictEqual(read.publishConfig, normalized.publishConfig) &&
                    "not normalized: publishConfig holds more than access",
                  npmrc.length > 0 && `not normalized: it holds ${npmrc.join(", ")}`,
                ].filter(Boolean);
                if (problems.length > 0) {
                  console.error(`::error::${name}: ${problems.join("; ")}`);
                  process.exit(1);
                }
              };
              run().catch((error) => {
                console.error(`::error::${name}: ${error.message}`);
                process.exit(1);
              });
            ' "$pacote" "$tarball" "$work/package" "$name" "$version" "$commit" "$channel" "$KEEP_FIELDS" >&2 || status=$?
            rm -rf "$work"
            return "$status"
          }

          # The dist.integrity the registry serves for <name>@<version>, retried: a version just published can
          # take a moment to read back. Nothing after the last try fails, never passes.
          published_integrity() {
            local attempt integrity
            for attempt in 1 2 3 4 5 6; do
              integrity=$(npm view "$1@$2" dist.integrity 2>/dev/null || true)
              if [[ -n $integrity ]]; then
                printf '%s\n' "$integrity"
                return 0
              fi
              sleep $((attempt * ${REPUBLISH_TEST_WAIT:-5}))
            done
            echo "::error::The registry serves no dist.integrity for $1@$2." >&2
            return 1
          }

          # <name>@<version> must be published with <integrity>, the tarball this run accepted. Anything else
          # is an incident: never republish over it.
          verify_integrity() {
            local served
            served=$(published_integrity "$1" "$2")
            if [[ $served != "$3" ]]; then
              echo "::error::INCIDENT: $1@$2 is published with integrity $served, not $3, the tarball this run packed. Do not republish: deprecate $1@$2 and cut a new version (DEVELOPMENT.md, Releasing)."
              return 1
            fi
            echo "$1@$2 is published with the integrity this run packed."
          }

          # Publishes <tarball> as it is, as <name>@<version> from <commit> under `latest` with <integrity>;
          # extra npm flags follow. A version already published from this commit is done once its integrity is
          # checked; from another commit, refused.
          publish_exact() {
            local tarball=$1 name=$2 version=$3 commit=$4 integrity=$5 from
            shift 5
            from=$(published_from "$name" "$version")
            if [[ -n $from ]]; then
              if [[ $from != "$commit" ]]; then
                echo "::error::$name@$version was published from $from, not $commit."
                return 1
              fi
              echo "$name@$version is already published from this commit."
              verify_integrity "$name" "$version" "$integrity"
              return
            fi
            npm publish "$tarball" --tag latest --access public --ignore-scripts "$@"
            verify_integrity "$name" "$version" "$integrity"
          }

          # The release: <tarballs> holds exactly the run's two tarballs of <version>, <release> exactly its
          # release-manifest.json. Checks both, and both tarballs, moves to an empty directory, and publishes
          # @sealant/api-contracts, then @sealant/sdk, which depends on it, from <commit>; extra npm flags
          # follow. With --verify-only first (the version is the stable floor: a retry), nothing is
          # republished and no dist-tag moves: each package npm holds must hold exactly this run's tarball. A
          # package npm does not hold yet publishes only after an earlier one verified as this run's, which
          # is what an attempt that stopped between the two packages leaves; npm holding neither means a
          # marker was moved by hand, and nothing publishes.
          publish_release() {
            local mode=publish
            if [[ $1 == --verify-only ]]; then
              mode=verify
              shift
            fi
            local tarballs=$1 release=$2 version=$3 commit=$4 name file integrity i held=0
            shift 4
            local -a names=(@sealant/api-contracts @sealant/sdk) files=() integrities=()
            for name in "${names[@]}"; do
              file=${name#@}
              files+=("${file//\//-}-$version.tgz")
            done
            check_artifacts "$tarballs" "${files[@]}"
            check_artifacts "$release" release-manifest.json
            # Every npm command runs from an empty directory: no project .npmrc can reach it.
            cd "$(mktemp -d)"
            for i in "${!names[@]}"; do
              integrity=$(recorded_integrity "$tarballs/${files[i]}" "$release/release-manifest.json" "${names[i]}" "$version" "$commit")
              integrities+=("$integrity")
              check_tarball "$tarballs/${files[i]}" "${names[i]}" "$version" "$commit" latest
            done
            for i in "${!names[@]}"; do
              if [[ $mode == verify ]]; then
                if [[ -n $(published_from "${names[i]}" "$version") ]]; then
                  echo "${names[i]}@$version is the stable floor; a same-version retry publishes nothing."
                  publish_exact "$tarballs/${files[i]}" "${names[i]}" "$version" "$commit" "${integrities[i]}"
                  held=1
                  continue
                fi
                if ((held == 0)); then
                  echo "::error::$version is the stable floor, but npm does not hold ${names[i]}@$version: a marker was moved by hand. Nothing was published."
                  return 1
                fi
                echo "${names[i]}@$version is not published yet: an earlier attempt stopped after the packages before it, so it publishes now."
              fi
              publish_exact "$tarballs/${files[i]}" "${names[i]}" "$version" "$commit" "${integrities[i]}" "$@"
            done
          }
          # --- end republish ---

          # Every marker is read before anything is published.
          floor=$(stable_floor "$GITHUB_REPOSITORY_OWNER")
          guard=$(stable_guard "$VERSION" "$floor")
          echo "Stable floor: ${floor:-none}; $VERSION may $guard."
          flags=()
          if [[ $guard == retry ]]; then flags+=(--verify-only); fi
          publish_release "${flags[@]}" "$GITHUB_WORKSPACE/npm" "$GITHUB_WORKSPACE/release" \
            "$VERSION" "$GITHUB_SHA" --provenance

  # The attached compose file is what install.sh downloads, and install.sh itself is attached so
  # `releases/latest/download/install.sh` (the get.sealant.dev redirect target) always serves the
  # exact script shipped with the release. The release is created without becoming latest:
  # promote moves `releases/latest`, the installer's default version, last.
  github-release:
    name: Publish GitHub release
    needs: [release, npm]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.release.result == 'success' &&
      needs.npm.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # This job publishes, so it refuses anything but a plain X.Y.Z that is its own tag's, however
      # the version arrived: a dry run never publishes (sealant-sh/mend #1028: check the resolved
      # version, not the input). tooling/scripts/release-publication.test.mjs runs this step.
      - name: Refuse a version that is not this tag's release
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          plain='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          if [[ $GITHUB_EVENT_NAME != push || ! $VERSION =~ $plain || $GITHUB_REF_NAME != "v$VERSION" ]]; then
            echo "::error::'$VERSION' on a $GITHUB_EVENT_NAME of $GITHUB_REF_NAME is not a plain X.Y.Z release of its own tag. This job publishes; a dry run never does."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A published release is never patched: with immutable releases on, an upload to one is
      # refused, and gh release create already uploads every asset to a draft before it publishes
      # (deleting the draft when that fails). So a published release with every asset is a retry,
      # one missing an asset is broken, fixed only by a new version. A draft for the tag is what a
      # runner killed mid-upload leaves: deleted, never reused, since its assets may be partial.
      # gh release view finds such a draft too (cli/cli pkg/cmd/release/shared/fetch.go,
      # fetchDraftRelease), so the releases are listed and told apart here, every read before any
      # write.
      # tooling/scripts/release-publication.test.mjs runs this step as written, against a stand-in gh.
      - name: Create the release with compose + installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(compose.selfhost.yaml install.sh)
          listed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          releases=$(jq -cs --arg tag "$GITHUB_REF_NAME" \
            '[.[][] | select(.tag_name == $tag) | {id, draft, assets: [.assets[].name]}]' <<<"$listed")
          published=$(jq -c '[.[] | select(.draft == false)]' <<<"$releases")
          drafts=$(jq -r '.[] | select(.draft == true) | .id' <<<"$releases")
          case $(jq length <<<"$published") in
            0) ;;
            1)
              missing=()
              for source in "${assets[@]}"; do
                if ! jq -e --arg name "${source##*/}" '.[0].assets | index($name) != null' \
                  <<<"$published" >/dev/null; then
                  missing+=("${source##*/}")
                fi
              done
              if ((${#missing[@]} > 0)); then
                echo "::error::published release is missing an asset; cut a new version (missing: ${missing[*]})"
                exit 1
              fi
              echo "$GITHUB_REF_NAME is published with every asset: a retry changes nothing."
              exit 0
              ;;
            *)
              echo "::error::More than one published release is tagged $GITHUB_REF_NAME."
              exit 1
              ;;
          esac
          for id in $drafts; do
            echo "Deleting draft release $id for $GITHUB_REF_NAME, left by an earlier attempt."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --latest=false \
            --verify-tag

      - name: Verify anonymous asset downloads
        run: |
          set -euo pipefail
          downloads="$(mktemp -d)"
          trap 'rm -rf "$downloads"' EXIT
          for asset in compose.selfhost.yaml install.sh; do
            curl -q --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 --max-time 60 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset" \
              --output "$downloads/$asset"
            cmp "$asset" "$downloads/$asset"
          done

  # :latest moves to the index digest this run accepted, never to whatever :<version> names when
  # this runs: each must still resolve to the manifest's index, all checked before any moves. Then
  # GitHub's latest release, install.sh's default version, moves last.
  promote:
    name: Promote the stable release
    needs: [release, finalize-images, npm, github-release]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.release.result == 'success' &&
      needs.finalize-images.result == 'success' && needs.npm.result == 'success' &&
      needs.github-release.result == 'success' }}
    # The release channel's lock, as finalize-images holds it. The floor is read again here, inside
    # the lock: it may have moved while this run waited.
    concurrency:
      group: sealant-release-channel
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      # This job publishes, so it refuses anything but a plain X.Y.Z that is its own tag's, however
      # the version arrived: a dry run never publishes (sealant-sh/mend #1028: check the resolved
      # version, not the input). tooling/scripts/release-publication.test.mjs runs this step.
      - name: Refuse a version that is not this tag's release
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          plain='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          if [[ $GITHUB_EVENT_NAME != push || ! $VERSION =~ $plain || $GITHUB_REF_NAME != "v$VERSION" ]]; then
            echo "::error::'$VERSION' on a $GITHUB_EVENT_NAME of $GITHUB_REF_NAME is not a plain X.Y.Z release of its own tag. This job publishes; a dry run never does."
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest
          path: release

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Needs npm >= 11 for the registry address the floor reads (`npm config get registry`).
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # tooling/scripts/release-publication.test.mjs runs this step as written, against a stub npm
      # registry, a stub GitHub API and a stand-in docker and gh.
      - name: Move latest to this release
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ github.workspace }}/release/release-manifest.json
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # Retried reads wait 1500 ms × attempt (registry_get, github_latest_release). Only a test sets
          # RELEASE_TEST_RETRY_MS, never a workflow; the log says which delays this run used.
          if [[ -z ${RELEASE_TEST_RETRY_MS:-} ]]; then
            echo "retry backoff: production (1500 ms × attempt)"
          elif [[ $RELEASE_TEST_RETRY_MS =~ ^(0|[1-9][0-9]{0,5})$ ]]; then
            echo "retry backoff: overridden to $RELEASE_TEST_RETRY_MS ms × attempt"
          else
            echo "::error::RELEASE_TEST_RETRY_MS is not a whole number of milliseconds."
            exit 1
          fi
          # --- floor ---
          # release-publication.test.mjs runs this block as written, against a stub npm registry, a stub
          # GitHub API and a stand-in docker. A stable release's floor is the highest of its markers, compared
          # as numbers X.Y.Z: npm's `latest` for each of FLOOR_PACKAGES, the tag of GitHub's latest release,
          # and the org.opencontainers.image.version label on every platform of each ghcr :latest in
          # FLOOR_IMAGES. A marker that does not exist adds nothing; one that cannot be read, or is present
          # but not a plain X.Y.Z, fails the job: never read as no floor. Each reader validates the whole value
          # it read before it is compared or joined to its source. A part of X.Y.Z has at most 9 digits, so
          # Bash's 64-bit arithmetic compares every version this accepts; a longer part fails as not plain.
          # :X.Y tags are not markers: nothing writes them.
          shopt -s inherit_errexit
          PLAIN_VERSION='^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$'
          FLOOR_PACKAGES=(@sealant/api-contracts @sealant/sdk)
          FLOOR_IMAGES=(sealant-api sealant-worker sealant-ssh-gateway sealant-web)

          # GET <path> from the registry, retried; a failure or a 404 stops the job: never guessed.
          registry_get() {
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [where, registry] = process.argv.slice(1);
              const url = new URL(where, registry.endsWith("/") ? registry : `${registry}/`);
              const run = async () => {
                for (let attempt = 1; attempt <= 4; attempt += 1) {
                  try {
                    const response = await fetch(url, { headers: { accept: "application/json" } });
                    if (response.ok) return process.stdout.write(JSON.stringify(await response.json()));
                    if (attempt === 4) throw new Error(`the registry answered ${response.status} for ${where}`);
                  } catch (error) {
                    if (attempt === 4) {
                      console.error(`::error::${error.message}`);
                      process.exit(1);
                    }
                  }
                  await new Promise((resolve) => setTimeout(resolve, attempt * Number(process.env.RELEASE_TEST_RETRY_MS || 1500)));
                }
              };
              run();
            ' -- "$1" "$(npm config get registry)"
          }

          # <value> is a plain X.Y.Z (each part at most 9 digits), or the job fails naming <marker>.
          plain_version() {
            if [[ ! $1 =~ $PLAIN_VERSION ]]; then
              echo "::error::$2 is '$1', not a plain X.Y.Z release; the floor cannot be read." >&2
              return 1
            fi
          }

          # npm's `latest` for <package>, validated, or nothing when the package has no `latest` dist-tag. The
          # answer must be a JSON object; a `latest` that is null, empty, not a string or not a plain X.Y.Z fails.
          npm_latest() {
            local tags
            tags=$(registry_get "-/package/${1/\//%2f}/dist-tags")
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [plain, what] = process.argv.slice(1);
              const fail = (why) => {
                console.error(`::error::${what} ${why}; the floor cannot be read.`);
                process.exit(1);
              };
              let tags;
              try {
                tags = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              } catch {
                fail("is not JSON");
              }
              if (tags === null || typeof tags !== "object" || Array.isArray(tags)) fail("is not a JSON object");
              if (!Object.hasOwn(tags, "latest")) process.exit(0);
              if (typeof tags.latest !== "string" || !new RegExp(plain).test(tags.latest))
                fail(`latest is ${JSON.stringify(tags.latest)}, not a plain X.Y.Z release`);
              process.stdout.write(tags.latest);
            ' "$PLAIN_VERSION" "npm:$1 dist-tags" <<<"$tags"
          }

          # -1, 0 or 1 as plain X.Y.Z <a> is below, equal to or above <b>.
          version_order() {
            local a b i
            IFS=. read -r -a a <<<"$1"
            IFS=. read -r -a b <<<"$2"
            for i in 0 1 2; do
              if ((10#${a[i]} < 10#${b[i]})); then echo -1 && return; fi
              if ((10#${a[i]} > 10#${b[i]})); then echo 1 && return; fi
            done
            echo 0
          }

          # The tag of the repository's latest GitHub release, without its v, or nothing when it has none: only
          # a 404 is none. A tag that is not exactly vX.Y.Z fails; other answers are retried, then fail.
          github_latest_release() {
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [api, repository, token, plain] = process.argv.slice(1);
              const url = `${api}/repos/${repository}/releases/latest`;
              const headers = { accept: "application/vnd.github+json", "x-github-api-version": "2022-11-28" };
              if (token) headers.authorization = `Bearer ${token}`;
              const run = async () => {
                for (let attempt = 1; attempt <= 4; attempt += 1) {
                  try {
                    const response = await fetch(url, { headers });
                    if (response.status === 404) return;
                    if (response.ok) {
                      const tag = (await response.json())?.tag_name;
                      if (typeof tag !== "string" || !tag.startsWith("v") || !new RegExp(plain).test(tag.slice(1)))
                        throw new Error(`the latest release is tagged ${JSON.stringify(tag)}, not vX.Y.Z`);
                      return process.stdout.write(tag.slice(1));
                    }
                    if (attempt === 4) throw new Error(`GitHub answered ${response.status} for ${url}`);
                  } catch (error) {
                    if (attempt === 4 || error.message.startsWith("the latest release")) {
                      console.error(`::error::${error.message}`);
                      process.exit(1);
                    }
                  }
                  await new Promise((resolve) => setTimeout(resolve, attempt * Number(process.env.RELEASE_TEST_RETRY_MS || 1500)));
                }
              };
              run();
            ' -- "${GITHUB_API_URL:-https://api.github.com}" "$GITHUB_REPOSITORY" "${GH_TOKEN:-}" "$PLAIN_VERSION"
          }

          # Reads <ref> with `imagetools inspect --format <format>` into stdout, prints nothing for a tag that
          # does not exist, and fails on anything else. Absent is buildx's not-found line and nothing else:
          # all of stderr, trailing newlines aside, is exactly `ERROR: <ref>: not found`, and stdout is empty.
          inspect_ref() {
            local out err status=0 errors
            errors=$(mktemp)
            out=$(docker buildx imagetools inspect "$1" --format "$2" 2>"$errors") || status=$?
            err=$(<"$errors")
            rm -f "$errors"
            if ((status == 0)) && [[ -n $out ]]; then
              printf '%s\n' "$out"
              return 0
            fi
            if ((status != 0)) && [[ -z $out && $err == "ERROR: $1: not found" ]]; then return 0; fi
            printf '%s\n' "$err" >&2
            echo "::error::Could not read $1; nothing was written." >&2
            return 1
          }

          # The digest <ref> names, or nothing when it does not exist.
          tag_digest() {
            local out digest
            out=$(inspect_ref "$1" '{{json .Manifest}}')
            [[ -n $out ]] || return 0
            digest=$(jq -r '.digest // ""' <<<"$out")
            if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$1 answered without a digest." >&2
              return 1
            fi
            printf '%s\n' "$digest"
          }

          # The org.opencontainers.image.version every platform of <ref> carries, or nothing when <ref> does
          # not exist. Each platform's label must be the whole string X.Y.Z, and all must be the same.
          image_version() {
            local out
            out=$(inspect_ref "$1" '{{json .Image}}')
            [[ -n $out ]] || return 0
            # One platform answers its config; an index answers each platform's config by platform.
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [plain, ref] = process.argv.slice(1);
              const fail = (why) => {
                console.error(`::error::${ref} ${why}; the floor cannot be read.`);
                process.exit(1);
              };
              let image;
              try {
                image = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              } catch {
                fail("answered an image config that is not JSON");
              }
              if (image === null || typeof image !== "object" || Array.isArray(image)) fail("answered no image config");
              const configs = Object.hasOwn(image, "config") ? [image] : Object.values(image);
              if (configs.length === 0) fail("answered no platform");
              const labels = configs.map((config) => config?.config?.Labels?.["org.opencontainers.image.version"]);
              const bad = labels.some((label) => typeof label !== "string" || !new RegExp(plain).test(label));
              if (bad || labels.some((label) => label !== labels[0]))
                fail(`carries no single plain X.Y.Z org.opencontainers.image.version (${labels.map((label) => JSON.stringify(label ?? null)).join(", ")})`);
              process.stdout.write(labels[0]);
            ' "$PLAIN_VERSION" "$1" <<<"$out"
          }

          # The floor of a stable release whose images are ghcr.io/<owner>/<FLOOR_IMAGES>: `<version> <marker>`
          # of the highest marker, or nothing when none exists. Every version here was validated by its reader;
          # versions and markers are kept apart until the result is printed.
          stable_floor() {
            local owner=$1 value package image i best=-1
            local -a versions=() sources=()
            for package in "${FLOOR_PACKAGES[@]}"; do
              value=$(npm_latest "$package")
              if [[ -n $value ]]; then versions+=("$value") && sources+=("npm:$package@latest"); fi
            done
            value=$(github_latest_release)
            if [[ -n $value ]]; then versions+=("$value") && sources+=("github:$GITHUB_REPOSITORY/releases/latest"); fi
            for image in "${FLOOR_IMAGES[@]}"; do
              value=$(image_version "ghcr.io/$owner/$image:latest")
              if [[ -n $value ]]; then versions+=("$value") && sources+=("ghcr.io/$owner/$image:latest"); fi
            done
            for i in "${!versions[@]}"; do
              plain_version "${versions[i]}" "${sources[i]}"
              if ((best < 0)) || [[ $(version_order "${versions[i]}" "${versions[best]}") == 1 ]]; then best=$i; fi
            done
            if ((best >= 0)); then printf '%s %s\n' "${versions[best]}" "${sources[best]}"; fi
          }

          # What a stable <version> may do against the floor line `<floor> <marker>` (empty: no floor):
          # `publish` above it, `retry` at it, and a refusal below it.
          stable_guard() {
            local version=$1 floor=${2%% *} marker=${2#* }
            plain_version "$version" "the release"
            if [[ -z $2 ]]; then
              echo publish
              return
            fi
            plain_version "$floor" "$marker"
            case $(version_order "$version" "$floor") in
              1) echo publish ;;
              0) echo retry ;;
              *)
                echo "::error::$version is below the stable floor $floor ($marker). A stable release never moves npm latest, ghcr :latest or GitHub's latest release backwards, so a backport such as 0.38.2 after 0.39.0 is refused on purpose: publishing one under its own dist-tag is a decision not yet made. Nothing was published or moved." >&2
                return 1
                ;;
            esac
          }
          # --- end floor ---

          if ! jq -e --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '.version == $version and .commit == $commit' "$MANIFEST" >/dev/null; then
            echo "::error::The release manifest is not this release's ($VERSION from $GITHUB_SHA)."
            exit 1
          fi
          # Every read before any write: the floor, each :<version>, each :latest.
          floor=$(stable_floor "$GITHUB_REPOSITORY_OWNER")
          guard=$(stable_guard "$VERSION" "$floor")
          echo "Stable floor: ${floor:-none}; $VERSION may $guard."
          declare -A index latest
          for image in "${FLOOR_IMAGES[@]}"; do
            repository="ghcr.io/$GITHUB_REPOSITORY_OWNER/$image"
            index[$image]=$(jq -r --arg image "$image" '.images[$image].index // ""' "$MANIFEST")
            if [[ ! ${index[$image]} =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The release manifest records no index digest for $image."
              exit 1
            fi
            current=$(tag_digest "$repository:$VERSION")
            if [[ $current != "${index[$image]}" ]]; then
              echo "::error::$repository:$VERSION resolves to ${current:-nothing}, not ${index[$image]}, the index this run accepted. latest stays."
              exit 1
            fi
            latest[$image]=$(tag_digest "$repository:latest")
          done
          # At the floor (a same-version retry), only a :latest not yet this run's index moves.
          for image in "${FLOOR_IMAGES[@]}"; do
            repository="ghcr.io/$GITHUB_REPOSITORY_OWNER/$image"
            if [[ $guard == retry && ${latest[$image]} == "${index[$image]}" ]]; then
              echo "$repository:latest is already ${index[$image]}."
              continue
            fi
            docker buildx imagetools create --tag "$repository:latest" "$repository@${index[$image]}"
          done
          # Last: GitHub's latest release is what install.sh installs by default.
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest
