# Versioning (no publish): on push to main, consume pending changesets and open/update the
# "Version Packages" PR that bumps @sealant/sdk + @sealant/api-contracts and writes CHANGELOGs.
# Publishing is tag-triggered in release.yml — this workflow deliberately has no `publish:` key
# and no npm credentials. Mirrors sealantd's version workflow.
name: Version

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    name: Open version PR
    # Forks must not open version PRs.
    if: github.repository == 'sealant-sh/sealant'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # No pnpm store cache: jobs running unowned code write it, and this job can push.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create or update the Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
