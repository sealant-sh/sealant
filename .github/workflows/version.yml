# Versioning (no publish): on push to main, consume pending changesets and open/update the
# "Version Packages" PR that bumps @sealant/sdk + @sealant/api-contracts and writes CHANGELOGs.
# Publishing is tag-triggered in release.yml — this workflow deliberately has no `publish:` key
# and no npm credentials. Mirrors sealantd's version workflow.
name: Version

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    name: Open version PR
    # Forks must not open version PRs.
    if: github.repository == 'sealant-sh/sealant'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull-request: ${{ steps.changesets.outputs.pullRequestNumber }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # No pnpm store cache: jobs running unowned code write it, and this job can push.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create or update the Version Packages PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub holds the Version Packages PR's pull_request runs at `action_required` because
  # github-actions[bot] pushed its branch, so `checks` and `e2e checks` never report on it.
  # Runs dispatched on the branch do not count either: the PR shows only its held runs. Approving
  # the held runs starts them as ordinary pull_request runs, which the PR counts. Only the runs this
  # workflow's own push created are approved: CI and Kubernetes e2e, on the PR's head commit,
  # triggered by github-actions[bot]. A job of its own, so the token that can push cannot approve.
  approve-checks:
    name: Start the Version Packages PR's checks
    needs: version
    if: needs.version.outputs.pull-request != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Approve its held CI and Kubernetes e2e runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.version.outputs.pull-request }}
          # GitHub creates the runs a few seconds after the push; give up after five minutes.
          TRIES: "30"
          POLL_SECONDS: "10"
        run: |
          set -euo pipefail
          branch=changeset-release/main
          head=$(gh pr view "$PR" --json headRefName,headRefOid \
            --jq "select(.headRefName == \"$branch\") | .headRefOid")
          if [ -z "$head" ]; then
            echo "::error::#$PR is not the Version Packages PR (head branch is not $branch)"
            exit 1
          fi
          pending="ci.yml kubernetes-e2e.yml"
          for try in $(seq "$TRIES"); do
            runs=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$head&event=pull_request&per_page=50" \
              --jq ".workflow_runs[] | select(.head_branch == \"$branch\")
                | [.path, .id, .conclusion // \"none\", .actor.login] | @tsv")
            left=""
            for workflow in $pending; do
              # Newest first: the run this push created.
              run=$(printf '%s\n' "$runs" | awk -F '\t' -v path=".github/workflows/$workflow" \
                '$1 == path { print; exit }')
              if [ -z "$run" ]; then
                left="$left $workflow"
                continue
              fi
              IFS=$'\t' read -r _ id conclusion actor <<<"$run"
              if [ "$conclusion" != action_required ]; then
                echo "$workflow run $id on $head is already started"
              elif [ "$actor" != "github-actions[bot]" ]; then
                echo "::error::$workflow run $id on $head waits for approval but $actor triggered it"
                exit 1
              else
                gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null
                echo "Approved $workflow run $id on $head"
              fi
            done
            pending=$left
            [ -z "$pending" ] && exit 0
            [ "$try" -lt "$TRIES" ] && sleep "$POLL_SECONDS"
          done
          echo "::error::No pull_request run of$pending appeared on $head"
          exit 1
