name: CI

on:
  pull_request:
  # x86 jobs run on GitHub's ubuntu-24.04 (free for a public repository). A dispatch with
  # `runner: box` sends them back to the box's self-hosted runners; no other event can reach it.
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the x86 jobs (box is the fallback; pull requests use ubuntu-24.04)
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - box

permissions:
  contents: read

# A pull request keeps only its newest run: a superseded head's result is never what anyone reads,
# and its jobs would hold runners the organization's other runs are waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Box runners keep a warm pnpm store (npm_config_store_dir=/opt/pnpm-store), so a dispatch to the
# box restores no GitHub cache there: downloading and re-uploading ~780 MB cost every job about 80 s.
jobs:
  lint:
    name: Lint
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every install in a workflow or an image build reads the committed lockfile. A lockfile-free
      # install re-resolves ranges at build time, which is how a prerelease (ours or a dependency's)
      # drifted into images that never asked for it (2026-09-13). The bracketed patterns keep this
      # step from matching itself.
      - name: Installs stay bound to the lockfile
        run: |
          if git grep -nE 'lockfile[=]false|PNPM_CONFIG_LOCKFIL[E]|no-frozen-lockfil[e]' -- \
            .github 'apps/*/Dockerfile' 'packages/**/Dockerfile*' 'tooling/**' '*.sh'; then
            echo "::error::Install with --frozen-lockfile, not without the lockfile."
            exit 1
          fi

      - name: Release scripts
        run:
          node --test tooling/scripts/next-version.test.mjs
          tooling/scripts/check-release-pins.test.mjs tooling/scripts/check-tarball.test.mjs
          tooling/scripts/republish.test.mjs tooling/scripts/pin-sealantd.test.mjs
          tooling/scripts/workflow-runners.test.mjs tooling/scripts/next-image-tag.test.mjs
          tooling/scripts/release-manifest.test.mjs tooling/scripts/release-publication.test.mjs
          tooling/scripts/release-overrides.test.mjs tooling/scripts/release-npm.test.mjs
          tooling/scripts/workflow-concurrency.test.mjs tooling/scripts/workflow-checks.test.mjs

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  # The unit and database suites, and the runtime proofs below, were one job that ran them in
  # series. They share nothing but their setup, so they are two jobs and a pull request waits for
  # the slower, not the sum.
  tests:
    name: Tests
    # Where next.yml's `test` runs (tooling/scripts/workflow-runners.test.mjs): a pull request is
    # tested in the environment its merge's Next tests in. On the box, a test that depended on the
    # host's /etc/skel passed every pull request and failed the first hosted Next (#370).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The `*.db.test.ts` suites (drain leases, retention with its exit write, launch preemption,
    # attestation freshness, idempotent creates) run against a real, migrated Postgres. They skip
    # themselves without SEALANT_TEST_DATABASE_URL, and turbo passes it to `test` (turbo.json).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sealant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 12
    env:
      SEALANT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sealant_test
      # The pg-boss queue suite keeps its own schema in the same database.
      SEALANT_JOBS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sealant_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.SEALANT_TEST_DATABASE_URL }}

      # The credential-file tests map their user to root in a private namespace. Rootless
      # workspace Docker needs these namespaces too. Ubuntu 24.04's AppArmor default refuses
      # the uid_map write, so allow and verify them before either test group runs.
      - name: Allow unprivileged user namespaces, as a Docker host must
        if: runner.environment == 'github-hosted'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Urn true

      - name: Unit and integration tests
        run: pnpm exec turbo test --force

      # The suites the step above skips for want of a gate: the Boat catalog and retention cases
      # (their own database and the staged runtime bundle) and the Effect runtime over the pinned
      # sealantd. `pnpm verify db` starts its own Postgres, stages the bundle, sets every gate and
      # fails on any skip, the same command an agent runs locally.
      - name: Gated suites, never skipped
        run: pnpm verify db boat-catalog sealantd-runtime

      - name: Keep the gated suites' logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-db
          path: .verify/
          include-hidden-files: true

      # `pnpm verify` itself: the result schema, the status roll-up and exit codes, the skip rule,
      # and the obligations map against the workflows' path filters.
      - name: The verify tool
        run: node --test tooling/verify/*.test.mjs

  # Real daemons, real Docker: each step is one proof against the runner's own Docker daemon.
  runtime-proofs:
    name: Runtime proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Boat publication suite, the resource reconciler and the caller-owned services proof
    # use the same migrated Postgres as the tests job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sealant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 12
    env:
      SEALANT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sealant_test
      # The pg-boss queue suite keeps its own schema in the same database.
      SEALANT_JOBS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sealant_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The runner's own docker CLI pulls from Docker Hub signed in (its ~/.docker/config.json), but
      # a Docker client inside a test container has no login: the volume test's controller pulls the
      # workspace guard image anonymously, and Docker Hub refuses anonymous pulls once a runner's
      # shared address spends its quota. With Google's mirror on the daemon, an anonymous pull is
      # served by the mirror, with no anonymous limit and no login. A signed-in pull is refused by
      # the mirror (it rejects Docker Hub's credentials) and goes on to Docker Hub signed in, as
      # before. dockerd restarts rather than reloads: on Docker 28 a SIGHUP reload loses the
      # host-gateway address that workspaces' host.docker.internal needs. The restart stops the
      # postgres service, so it starts again here.
      - name: Serve anonymous Docker Hub pulls from Google's mirror
        if: runner.environment == 'github-hosted'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          config=/etc/docker/daemon.json
          current=$(sudo cat "$config" 2>/dev/null || echo '{}')
          echo "$current" | jq '."registry-mirrors" = ["https://mirror.gcr.io"]' | sudo tee "$config"
          sudo systemctl restart docker
          docker info --format 'registry mirrors: {{json .RegistryConfig.Mirrors}}'
          docker start "$POSTGRES_CONTAINER"
          for _ in $(seq 1 60); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$POSTGRES_CONTAINER")
            [ "$health" = healthy ] && exit 0
            sleep 1
          done
          echo "the postgres service is $health after the Docker restart" >&2
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.SEALANT_TEST_DATABASE_URL }}

      # Rootless workspace Docker needs unprivileged user namespaces. Ubuntu 24.04's AppArmor
      # default refuses the uid_map write, so allow and verify them before the proofs run.
      - name: Allow unprivileged user namespaces, as a Docker host must
        if: runner.environment == 'github-hosted'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Urn true

      # The binary from the image sealant pins (the reference pin-sealantd.mjs writes), copied out
      # of a container that is created and never started.
      - name: The pinned sealantd binary
        run: |
          image=$(node tooling/scripts/pin-sealantd.mjs --print-image)
          echo "sealantd: $image"
          container=$(docker create "$image" /usr/local/bin/sealantd)
          docker cp "$container:/usr/local/bin/sealantd" "$RUNNER_TEMP/sealantd"
          docker rm "$container"
          "$RUNNER_TEMP/sealantd" --version

      # The Tests job skips these suites without a binary; REQUIRE_SEALANTD=1 makes a missing one
      # fail.
      - name: API forwards through a real sealantd (never skipped)
        env:
          SEALANTD_BIN: ${{ runner.temp }}/sealantd
          REQUIRE_SEALANTD: "1"
        run: pnpm --filter @sealant/api exec vitest run daemon.test --reporter=verbose

      - name: SSH gateway forwards through a real sealantd (never skipped)
        env:
          SEALANTD_BIN: ${{ runner.temp }}/sealantd
          REQUIRE_SEALANTD: "1"
        run: pnpm --filter @sealant/ssh-gateway exec vitest run daemon.test --reporter=verbose

      - name: Native Ubuntu root resolves the project catalog packages
        run: pnpm --filter @sealant/workspaces test:e2e src/images/boat/recipe.e2e.ts

      # Then the native builder over HTTP with the same bundle: a failed install, save or provider
      # call keeps safe diagnostics and removes its scratch VM; a cancel still cleans up.
      - name: Boat worker publication, readiness, shell, FINAL and fresh resume; builder failures
        env:
          SEALANT_BOAT_RUNTIME_BUNDLE: ${{ runner.temp }}/boat-session-proof/boat-assets
        run: |
          mkdir -p "$RUNNER_TEMP/boat-session-proof"
          node packages/workspaces/boat-image/stage-assets.mjs "$SEALANT_BOAT_RUNTIME_BUNDLE"
          pnpm --filter @sealant/workspaces exec vitest run src/worker/native-publication.db.test.ts
          pnpm --filter @sealant/workspaces test:e2e src/images/boat/builder.e2e.ts

      # The release installer custom images use (`customRelease`), on a non-Arch base, run as a
      # non-root user: the Arch image job installs Doppler but never runs it.
      - name: A pinned release-archive package runs as a non-root workspace user
        run: pnpm --filter @sealant/workspaces test:e2e src/buildkit/doppler.e2e.ts

      - name: Containerized launcher and real workspace volume test
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/runtime/docker-volume-mounts.e2e.ts

      - name: Cloud metadata address refused from workspaces, reached when opted in
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/runtime/cloud-metadata.e2e.ts

      # Resource instances on this daemon: reach by name and never between workspaces, data kept
      # through stop and archive, streamed exec; then the worker's hooks and tick, in a database of
      # their own made from the migrated one.
      - name: Resource instances run, reach their workspaces only, and keep their data
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/resources/docker-resource-runtime.e2e.ts
          src/resources/reconciler.e2e.ts

      - name:
          Caller DNS forwards to configured private resolvers while other private traffic is denied
        run: pnpm --filter @sealant/workspaces test:e2e src/resources/caller-dns.e2e.ts

      - name: Build the Boat resource gateway and test real encrypted reach isolation
        env:
          SEALANT_BOAT_TUNNEL_TEST_IMAGE_FILE: ${{ runner.temp }}/boat-tunnel-image-id
        run: |
          docker build --iidfile "$SEALANT_BOAT_TUNNEL_TEST_IMAGE_FILE" -f packages/workspaces/boat-tunnel/Dockerfile packages/workspaces/boat-tunnel
          python3 -B -m unittest discover -s packages/workspaces/boat-tunnel -p 'test_*.py'
          pnpm --filter @sealant/workspaces test:e2e src/resources/boat-tunnel.e2e.ts

      - name: Caller-owned services through SDK, isolated from workspaces, with retained backup
        env:
          SEALANT_CALLER_DOCKER_E2E: "1"
        run:
          pnpm exec vitest run apps/api/src/routes/resource-domains/caller-instances.docker.test.ts

  # An Arch workspace image built and run on each architecture's own Docker daemon: Docker Hub's
  # `archlinux` on amd64, Arch Linux ARM's verified rootfs on arm64. It carries every catalog
  # package and every baked harness, and checks they run natively (`uname -m`, the harnesses).
  arch-native:
    name: Arch image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on:
      ${{ matrix.arch == 'amd64' && inputs.runner == 'box' &&
      fromJSON('["self-hosted","box","linux","x64"]') || matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # Box runners link installs from their persistent pnpm store (npm_config_store_dir);
          # every other runner starts empty, so only those restore GitHub's pnpm cache.
          cache: ${{ (matrix.arch == 'arm64' || inputs.runner != 'box') && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and run an Arch workspace image
        run: pnpm --filter @sealant/workspaces test:e2e src/buildkit/arch-native.e2e.ts

  # Which formal models (docs/formal/<area>/COVERAGE) this pull request touches: a model's covered
  # code or the model itself. It installs nothing; formal.mjs reads COVERAGE and git only.
  formal-scope:
    name: Formal scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      touched: ${{ steps.scope.outputs.touched }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A dispatch has no base to diff against, so it checks every model.
      - name: Does the diff touch a model's covered paths?
        id: scope
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            node tooling/verify/formal.mjs scope "origin/$BASE" >> "$GITHUB_OUTPUT"
          fi

  # The touched models at their quick bounds (hosted runners have four cores; every bound runs in
  # formal-nightly.yml), and the drift guard: covered code that changed while neither its model nor
  # its COVERAGE sync commit did fails here. Skipped when the diff touches no model.
  formal:
    name: Formal models (quick bounds)
    needs: formal-scope
    if: needs.formal-scope.outputs.touched == 'true'
    runs-on: ubuntu-24.04
    # Measured at 7 minutes with a cold tlx build, 3 of them checking (SLNT-1081); about three times.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tlx at the commit docs/formal/tlx.sh pins, cached by that commit: the checker every case's
      # pinned state count was compared against TLC's at (SLNT-1081).
      - name: tlx
        uses: ./.github/actions/tlx

      - name: Quick bounds and the drift guard
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE" ]; then
            pnpm verify formal --all
          else
            pnpm verify formal --base "origin/$BASE"
          fi

      - name: Keep the model's output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-formal
          path: .verify/
          include-hidden-files: true

  # The one result branch protection requires from this workflow. Requiring each job by name leaves
  # a check pending forever when a job is skipped, renamed or re-matrixed, so this job reads every
  # other job's result instead. `always()`, not `!cancelled()`: a skipped roll-up would count as
  # passed. tooling/scripts/workflow-checks.test.mjs fails when a job is missing from `needs`.
  checks:
    name: checks
    needs: [lint, typecheck, tests, runtime-proofs, arch-native, formal-scope, formal]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Reads only `needs`: no checkout, and the runner image's Node runs it.
      - name: Require every CI job
        env:
          RESULTS: ${{ toJSON(needs) }}
          # The jobs allowed to be skipped on purpose (a path filter, a condition): `formal` runs only
          # when formal-scope finds a model the diff touches. Every other job must succeed.
          MAY_SKIP: '["formal"]'
        run: |
          node --input-type=module <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          const maySkip = new Set(JSON.parse(process.env.MAY_SKIP));
          const refused = Object.entries(results).filter(
            ([job, { result }]) => !(result === "success" || (result === "skipped" && maySkip.has(job))),
          );
          for (const [job, { result }] of refused) console.log(`::error::${job}: ${result}`);
          if (refused.length > 0 || Object.keys(results).length === 0) process.exit(1);
          console.log(`Every job passed: ${Object.keys(results).join(", ")}`);
          NODE
