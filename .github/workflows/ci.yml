name: CI

on:
  pull_request:
  # x86 jobs run on GitHub's ubuntu-24.04 (free for a public repository). A dispatch with
  # `runner: box` sends them back to the box's self-hosted runners; no other event can reach it.
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the x86 jobs (box is the fallback; pull requests use ubuntu-24.04)
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - box

permissions:
  contents: read

# A pull request keeps only its newest run: a superseded head's result is never what anyone reads,
# and its jobs would hold runners the organization's other runs are waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Box runners keep a warm pnpm store (npm_config_store_dir=/opt/pnpm-store), so a dispatch to the
# box restores no GitHub cache there: downloading and re-uploading ~780 MB cost every job about 80 s.
jobs:
  lint:
    name: Lint
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every install in a workflow or an image build reads the committed lockfile. A lockfile-free
      # install re-resolves ranges at build time, which is how a prerelease (ours or a dependency's)
      # drifted into images that never asked for it (2026-09-13). The bracketed patterns keep this
      # step from matching itself.
      - name: Installs stay bound to the lockfile
        run: |
          if git grep -nE 'lockfile[=]false|PNPM_CONFIG_LOCKFIL[E]|no-frozen-lockfil[e]' -- \
            .github 'apps/*/Dockerfile' 'packages/**/Dockerfile*' 'tooling/**' '*.sh'; then
            echo "::error::Install with --frozen-lockfile, not without the lockfile."
            exit 1
          fi

      - name: Release scripts
        run:
          node --test tooling/scripts/next-version.test.mjs
          tooling/scripts/check-release-pins.test.mjs tooling/scripts/check-tarball.test.mjs
          tooling/scripts/republish.test.mjs tooling/scripts/pin-sealantd.test.mjs
          tooling/scripts/workflow-runners.test.mjs tooling/scripts/next-image-tag.test.mjs
          tooling/scripts/release-manifest.test.mjs tooling/scripts/release-publication.test.mjs
          tooling/scripts/release-overrides.test.mjs tooling/scripts/release-npm.test.mjs
          tooling/scripts/workflow-concurrency.test.mjs

      - name: Run lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on:
      ${{ inputs.runner == 'box' && fromJSON('["self-hosted","box","linux","x64"]') ||
      'ubuntu-24.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: ${{ inputs.runner != 'box' && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  docker-volume-mounts:
    name: Docker volume mounts
    # Where next.yml's `test` runs (tooling/scripts/workflow-runners.test.mjs): a pull request is
    # tested in the environment its merge's Next tests in. On the box, a test that depended on the
    # host's /etc/skel passed every pull request and failed the first hosted Next (#370).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The `*.db.test.ts` suites (drain leases, retention with its exit write, launch preemption,
    # attestation freshness, idempotent creates) run against a real, migrated Postgres. They skip
    # themselves without SEALANT_TEST_DATABASE_URL, and turbo passes it to `test` (turbo.json).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sealant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 12
    env:
      SEALANT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sealant_test
      # The pg-boss queue suite keeps its own schema in the same database.
      SEALANT_JOBS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sealant_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.SEALANT_TEST_DATABASE_URL }}

      # The credential-file tests map their user to root in a private namespace. Rootless
      # workspace Docker needs these namespaces too. Ubuntu 24.04's AppArmor default refuses
      # the uid_map write, so allow and verify them before either test group runs.
      - name: Allow unprivileged user namespaces, as a Docker host must
        if: runner.environment == 'github-hosted'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Urn true

      - name: Unit and integration tests
        run: pnpm exec turbo test --force

      # The binary from the image Core pins (the reference pin-sealantd.mjs writes), copied out of a
      # container that is created and never started.
      - name: The pinned sealantd binary
        run: |
          image=$(node tooling/scripts/pin-sealantd.mjs --print-image)
          echo "sealantd: $image"
          container=$(docker create "$image" /usr/local/bin/sealantd)
          docker cp "$container:/usr/local/bin/sealantd" "$RUNNER_TEMP/sealantd"
          docker rm "$container"
          "$RUNNER_TEMP/sealantd" --version

      # The suites above skip these without a binary; REQUIRE_SEALANTD=1 makes a missing one fail.
      - name: API forwards through a real sealantd (never skipped)
        env:
          SEALANTD_BIN: ${{ runner.temp }}/sealantd
          REQUIRE_SEALANTD: "1"
        run: pnpm --filter @sealant/api exec vitest run daemon.test --reporter=verbose

      - name: SSH gateway forwards through a real sealantd (never skipped)
        env:
          SEALANTD_BIN: ${{ runner.temp }}/sealantd
          REQUIRE_SEALANTD: "1"
        run: pnpm --filter @sealant/ssh-gateway exec vitest run daemon.test --reporter=verbose

      - name: Native Ubuntu root resolves the project catalog packages
        run: pnpm --filter @sealant/workspaces test:e2e src/images/boat/recipe.e2e.ts

      - name: Boat readiness authenticates real daemon health through its relay
        env:
          SEALANTD_BIN: ${{ runner.temp }}/sealantd
        run: pnpm --filter @sealant/workspaces test:e2e src/runtime/boat/readiness.e2e.ts

      - name: Boat worker publication, readiness, shell, FINAL and fresh resume
        env:
          SEALANT_BOAT_RUNTIME_BUNDLE: ${{ runner.temp }}/boat-session-proof/boat-assets
        run: |
          mkdir -p "$RUNNER_TEMP/boat-session-proof"
          node packages/workspaces/boat-image/stage-assets.mjs "$SEALANT_BOAT_RUNTIME_BUNDLE"
          pnpm --filter @sealant/workspaces exec vitest run src/worker/native-publication.db.test.ts

      - name: Containerized launcher and real workspace volume test
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/runtime/docker-volume-mounts.e2e.ts

      - name: Boat parking resumes pinned daemon staging without replaying user hooks
        env:
          SEALANTD_BIN: ${{ runner.temp }}/sealantd
        run: pnpm --filter @sealant/workspaces test:e2e src/runtime/boat/parking-daemon.e2e.ts

      - name: Cloud metadata address refused from workspaces, reached when opted in
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/runtime/cloud-metadata.e2e.ts

      # Resource instances on this daemon: reach by name and never between workspaces, data kept
      # through stop and archive, streamed exec; then the worker's hooks and tick, in a database of
      # their own made from the migrated one.
      - name: Resource instances run, reach their workspaces only, and keep their data
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/resources/docker-resource-runtime.e2e.ts
          src/resources/reconciler.e2e.ts

      - name:
          Caller DNS forwards to configured private resolvers while other private traffic is denied
        run: pnpm --filter @sealant/workspaces test:e2e src/resources/caller-dns.e2e.ts

      - name: Build the Boat resource gateway and test real encrypted reach isolation
        env:
          SEALANT_BOAT_TUNNEL_TEST_IMAGE_FILE: ${{ runner.temp }}/boat-tunnel-image-id
        run: |
          docker build --iidfile "$SEALANT_BOAT_TUNNEL_TEST_IMAGE_FILE" -f packages/workspaces/boat-tunnel/Dockerfile packages/workspaces/boat-tunnel
          python3 -B -m unittest discover -s packages/workspaces/boat-tunnel -p 'test_*.py'
          pnpm --filter @sealant/workspaces test:e2e src/resources/boat-tunnel.e2e.ts

      - name: Packaged Boat guest isolates its network and reaches resources over WireGuard
        env:
          SEALANT_BOAT_TUNNEL_TEST_IMAGE_FILE: ${{ runner.temp }}/boat-tunnel-image-id
          SEALANT_BOAT_GUEST_TEST_IMAGE_FILE: ${{ runner.temp }}/boat-guest-image-id
          SEALANTD_BIN: ${{ runner.temp }}/sealantd
        run: |
          docker build --iidfile "$SEALANT_BOAT_GUEST_TEST_IMAGE_FILE" -f packages/workspaces/boat-image/Dockerfile.network-test packages/workspaces/boat-image
          pnpm --filter @sealant/workspaces test:e2e src/runtime/boat/public-command.e2e.ts
          unshare -Urm python3 -B -m unittest discover -s packages/workspaces/boat-image -p 'test_*.py'
          python3 -B packages/workspaces/boat-image/network_proof.py
          python3 -B packages/workspaces/boat-image/control_daemon_proof.py

      - name: Caller-owned services through SDK, isolated from workspaces, with retained backup
        env:
          SEALANT_CALLER_DOCKER_E2E: "1"
        run:
          pnpm exec vitest run apps/api/src/routes/resource-domains/caller-instances.docker.test.ts

  # An Arch workspace image built and run on each architecture's own Docker daemon: Docker Hub's
  # `archlinux` on amd64, Arch Linux ARM's verified rootfs on arm64. It carries every catalog
  # package and every baked harness, and checks they run natively (`uname -m`, the harnesses).
  arch-native:
    name: Arch image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on:
      ${{ matrix.arch == 'amd64' && inputs.runner == 'box' &&
      fromJSON('["self-hosted","box","linux","x64"]') || matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # Box runners link installs from their persistent pnpm store (npm_config_store_dir);
          # every other runner starts empty, so only those restore GitHub's pnpm cache.
          cache: ${{ (matrix.arch == 'arm64' || inputs.runner != 'box') && 'pnpm' || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and run an Arch workspace image
        run: pnpm --filter @sealant/workspaces test:e2e src/buildkit/arch-native.e2e.ts
