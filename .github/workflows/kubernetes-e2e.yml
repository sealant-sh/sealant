name: Kubernetes e2e

# The cross-node workspace E2E (design §3, PR 6) plus the existing Docker runtime E2E in one
# matrix, so a change to the runtime seams is proven against both lowerings.
#
# The Kubernetes leg: kind (3 nodes), a generic RWX StorageClass (NFS CSI — deliberately not a
# vendor driver), cert-manager, an in-cluster registry, and the sealantd Core pins: the image
# digest pin-sealantd.mjs writes into buildkit-builder.ts, which is what ships. A dispatch that
# names a sealantd ref builds the daemon from that ref instead (it must carry the WSS frontend,
# sealant-sh/sealantd#60).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sealantd_ref:
        description: sealant-sh/sealantd git ref to build the daemon from (empty runs the pin)
        default: ""
      runner:
        description: Runner for the box's x86 jobs (a measurement; pull requests always use the box)
        type: choice
        default: box
        options:
          - box
          - blacksmith-2vcpu-ubuntu-2404
          - blacksmith-4vcpu-ubuntu-2404
          - ubuntu-latest

permissions:
  contents: read

# A ref's newer run cancels its older one. A dispatch is its own group: on main it would share the
# push run's group, so it could cancel that commit's e2e, or a later push could cancel it.
concurrency:
  group:
    k8s-e2e-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) ||
    github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker runtime e2e
    runs-on:
      ${{ inputs.runner && inputs.runner != 'box' && inputs.runner ||
      fromJSON('["self-hosted","box","linux","x64"]') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        # The box's persistent pnpm store, not GitHub's cache; other runners start empty.
        with:
          {
            node-version: 22,
            cache: "${{ inputs.runner && inputs.runner != 'box' && 'pnpm' || '' }}",
          }
      - run: pnpm install --frozen-lockfile
      - name: Build the baked workspace image (pinned sealantd)
        run:
          DOCKER_BUILDKIT=1 pnpm --filter @sealant/workspaces exec tsx
          scripts/sealantd-build-image.mts
      - name: Run the Docker sealantd e2e suite
        env: { SEALANT_E2E_REQUIRE_IMAGE: "1" }
        run: pnpm --filter @sealant/workspaces test:e2e src/sealantd
      - name: Image-build phase (progress, a kept image reused, a silent build stopped)
        run: pnpm --filter @sealant/workspaces test:e2e src/buildkit/build-phases.e2e.ts
      - name: Capture owner map through the Docker adapter and a real daemon
        env: { SEALANT_E2E_REQUIRE_IMAGE: "1" }
        run: pnpm --filter @sealant/workspaces test:e2e src/runtime/capture-owner-map.e2e.ts
      - name: Dotfiles as a person, and pi/opencode logins in a person's home (never skipped)
        env: { SEALANT_E2E_REQUIRE_IMAGE: "1" }
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/runtime/dotfiles-apply.e2e.ts
          src/runtime/home-credentials.e2e.ts
      - name: Executions and sessions as a person, and a sealantd without exec.user (never skipped)
        env: { SEALANT_E2E_REQUIRE_IMAGE: "1" }
        run: pnpm --filter @sealant/workspaces test:e2e src/runtime/process-user.e2e.ts
      - name: SSH sessions as the workspace's user through the gateway (never skipped)
        env: { SEALANT_E2E_REQUIRE_IMAGE: "1" }
        run: pnpm --filter @sealant/ssh-gateway test:e2e

  kubernetes:
    name: Kubernetes cross-node e2e (kind, generic RWX)
    runs-on:
      ${{ inputs.runner && inputs.runner != 'box' && inputs.runner ||
      fromJSON('["self-hosted","box","linux","x64"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        # The box's persistent pnpm store, not GitHub's cache; other runners start empty.
        with:
          {
            node-version: 22,
            cache: "${{ inputs.runner && inputs.runner != 'box' && 'pnpm' || '' }}",
          }
      - run: pnpm install --frozen-lockfile

      # The pinned image is sealantd's docker/Dockerfile built by its next workflow, pulled by digest:
      # the daemon that ships, without rebuilding it from source on every run.
      - name: The sealantd Core pins
        if: ${{ !github.event.inputs.sealantd_ref }}
        run: |
          image=$(grep -oE 'ghcr\.io/sealant-sh/sealantd(-next)?:[^"]+@sha256:[0-9a-f]{64}' \
            packages/workspaces/src/buildkit/buildkit-builder.ts | sort -u)
          if [ -z "$image" ] || [ "$(printf '%s\n' "$image" | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one pinned sealantd image in buildkit-builder.ts, found: ${image:-none}"
            exit 1
          fi
          echo "sealantd: $image"
          docker pull "$image"
          docker tag "$image" sealantd:e2e
      - name: Check out sealantd at the dispatched ref
        if: ${{ github.event.inputs.sealantd_ref }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sealant-sh/sealantd
          ref: ${{ github.event.inputs.sealantd_ref }}
          path: .sealantd
      - name: Build sealantd from the dispatched ref (with the WSS frontend)
        if: ${{ github.event.inputs.sealantd_ref }}
        run: docker build -t sealantd:e2e -f .sealantd/docker/Dockerfile .sealantd

      - name: Install kind, kubectl, helm
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.27.0

      - name: Chart renders the workspace image platform
        run: deploy/helm/image-platform.test.sh

      - name: Bring the cluster up
        env: { SEALANTD_IMAGE: sealantd:e2e }
        # up.sh exports KUBECONFIG only inside its own shell; persist it for the test step,
        # or the client falls back to in-cluster config on the runner ("Invalid URL").
        run: |
          deploy/e2e/kind/up.sh
          echo "KUBECONFIG=${KUBECONFIG:-$HOME/.kube/config}" >> "$GITHUB_ENV"

      # `src/kubernetes` also holds docker-service.e2e.ts (workspace-scoped Docker). That suite
      # probes for a user-namespaced Pod first and SKIPS here: kind on a GitHub-hosted runner cannot
      # create one (the sandbox's sysfs mount is refused inside the nested containerd). It runs for
      # real against a cluster with user-namespace support — see the suite header.
      - name: Run the Kubernetes e2e suite
        env:
          SEALANT_K8S_E2E: "1"
          E2E_TLS_DIR: ${{ github.workspace }}/deploy/e2e/kind/.tls
          SEALANT_SEALANTD_IMAGE: sealant-registry.sealant.svc:5000/sealant/sealantd:e2e
        run: pnpm --filter @sealant/workspaces test:e2e src/kubernetes

      # Dump the whole cluster, not just `sealant`: a bring-up can die in cert-manager or
      # e2e-storage, long before that namespace exists, and a dump scoped to it prints only
      # "No resources found" (sealant#241). KUBECONFIG is set explicitly because up.sh only
      # persists it to $GITHUB_ENV once it has succeeded.
      - name: Dump cluster state on failure
        if: failure()
        env:
          KUBECONFIG: ${{ env.KUBECONFIG || '/home/runner/.kube/config' }}
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods --all-namespaces -o wide || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -100 || true
          kubectl -n sealant get svc,secrets,certificates,jobs -o wide || true
          kubectl get pods --all-namespaces --no-headers 2>/dev/null \
            | awk '$4 != "Running" && $4 != "Completed" { print $1, $2 }' \
            | while read -r ns name; do
                echo "== $ns/$name"
                kubectl -n "$ns" describe pod "$name" || true
                kubectl -n "$ns" logs "$name" --all-containers --tail=200 || true
              done
          for p in $(kubectl -n sealant get pods -o name 2>/dev/null); do
            echo "== $p"; kubectl -n sealant logs "$p" --all-containers --tail=200 || true
          done
