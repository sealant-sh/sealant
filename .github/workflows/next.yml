# Prereleases from main (ADR 0015 in sealant-sh/mend, docs/adr/0015-next-channel.md). Every merge to
# main publishes, under one version B-next.N (tooling/scripts/next-version.mjs: N is the commit's
# whole history, B never below a base already published since the last stable tag):
#
# - ghcr.io/sealant-sh/sealant-{api,worker,ssh-gateway}:<version>, the images Mend's bundle copies,
#   amd64 and arm64, each built natively, tagged once the tests and the workspace e2e passed;
# - @sealant/sdk and @sealant/api-contracts <version> on npm's `next` dist-tag, after the images.
#
# `latest` (npm and GHCR) moves only from a vX.Y.Z tag, in release.yml. No floating tags: Mend pins
# the exact version and the images by digest. sealant-web stays release-only: Mend does not use it.
#
# The npm credential (OIDC, `id-token: write`) is held only by `publish`, which checks out nothing
# and runs no repository code. It never publishes the tarballs `pack` made: it extracts each with
# pacote (npm's own reader, pinned and installed in the job), rewrites package.json from an
# allowlist (no `tag`, no scripts, no publishConfig but `access`), checks the name, the -next
# version and the commit on that, repacks it, and publishes that under `next`. A build dependency never sees the
# credential. What this cannot stop on its own: someone who can merge an edit to this file. That
# needs code-owner review on main (CODEOWNERS covers .github/ and the release scripts) and the
# `next` environment limited to main; both are repository settings (ADR 0015, decision 3).
#
# Register the publisher on both packages as a second trusted publisher: repository
# sealant-sh/sealant, workflow next.yml, environment next.
name: Next

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: next
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve the version
    if: github.repository == 'sealant-sh/sealant'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # Full history and tags: N counts the commit's whole history.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve the version
        id: plan
        run: |
          set -euo pipefail
          version=$(node tooling/scripts/next-version.mjs --package packages/sdk --npm @sealant/sdk HEAD)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$ ]] || {
            echo "::error::\"$version\" is not a next version."
            exit 1
          }
          # npm is the last step, so a version already there was published completely: a re-run
          # of this commit publishes nothing again. The same version from another commit is refused.
          # Every lookup fails the run on a registry error; nothing reads as "not published".
          publish=true
          from=$(node tooling/scripts/next-version.mjs --published @sealant/sdk "$version")
          if [[ -n $from ]]; then
            if [[ $from != "$GITHUB_SHA" ]]; then
              echo "::error::@sealant/sdk@$version was published from $from, not $GITHUB_SHA."
              exit 1
            fi
            publish=false
            echo "Sealant $version is already published from this commit; nothing to do."
          fi
          # `next` only moves forward. Every newer commit computes a higher version, so this fails
          # only for an older commit re-run after a newer one published: loudly, before any build.
          # `publish` checks again right before publishing.
          if [[ $publish == true ]]; then
            current=$(node tooling/scripts/next-version.mjs --dist-tag @sealant/sdk next)
            if [[ -n $current ]] && ! node tooling/scripts/next-version.mjs --newer "$version" "$current"; then
              echo "::error::npm's next is already $current; $version from this commit is not newer. A newer commit published first."
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Image (${{ matrix.image }}, ${{ matrix.platform.arch }})
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, ssh-gateway]
        platform:
          - { arch: amd64, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { arch: arm64, runner: blacksmith-4vcpu-ubuntu-2404-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker builder (Blacksmith cache)
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          outputs:
            type=image,name=ghcr.io/${{ github.repository_owner }}/sealant-${{ matrix.image
            }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: next-digests-${{ matrix.image }}--${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # What CI runs on a pull request beyond lint and typecheck, which main requires: the unit and
  # integration suites against a migrated Postgres. A next build never publishes over a failing one.
  test:
    name: Unit and integration tests
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sealant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 12
    env:
      SEALANT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sealant_test
      SEALANT_JOBS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sealant_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.SEALANT_TEST_DATABASE_URL }}

      - name: Unit and integration tests
        run: pnpm exec turbo test --force

  # The same proof the release runs before it publishes the SDK: the baked workspace image with the
  # pinned sealantd, and the sealantd e2e suite in required mode.
  workspace-e2e:
    name: Workspace runtime e2e (pinned sealantd)
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the baked workspace image (pulls the pinned sealantd)
        run:
          DOCKER_BUILDKIT=1 pnpm --filter @sealant/workspaces exec tsx
          scripts/sealantd-build-image.mts

      - name: Run sealantd e2e suite (image required, never skipped)
        env:
          SEALANT_E2E_REQUIRE_IMAGE: "1"
        run: pnpm --filter @sealant/workspaces test:e2e src/sealantd

      - name: Containerized launcher and real workspace volume test
        run: >-
          pnpm --filter @sealant/workspaces test:e2e src/runtime/docker-volume-mounts.e2e.ts

  # Tagged only after the tests and the e2e passed, so no version exists without its npm packages
  # being about to follow.
  image-tag:
    name: Tag (${{ matrix.image }})
    needs: [plan, image, test, workspace-e2e]
    strategy:
      matrix:
        image: [api, worker, ssh-gateway]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: next-digests-${{ matrix.image }}--*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch image
        working-directory: /tmp/digests
        env:
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/sealant-${{ matrix.image }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # A version is tagged once: a re-run after a failed npm job keeps the image Mend may
          # already have pinned by digest.
          if ! docker buildx imagetools inspect "$REPOSITORY:$VERSION" >/dev/null 2>&1; then
            sources=()
            for digest in *; do sources+=("$REPOSITORY@sha256:$digest"); done
            docker buildx imagetools create --tag "$REPOSITORY:$VERSION" "${sources[@]}"
          fi
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "- \`$REPOSITORY:$VERSION\` (\`$digest\`)" >> "$GITHUB_STEP_SUMMARY"

  # Builds and packs the two packages. No id-token here: nothing this job runs, the dependencies'
  # build tools included, can reach the npm credential.
  pack:
    name: Pack npm prereleases
    needs: [plan, image-tag]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The version and the commit go into each package.json: npm records `gitHead`, which the plan
      # job compares on a re-run and Core's release guard reads to find a prerelease's commit.
      - name: Set the prerelease version and commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for package in packages/api-contracts packages/sdk; do
            (cd "$package" && npm version "$VERSION" --no-git-tag-version --allow-same-version \
              && npm pkg set "gitHead=$GITHUB_SHA")
          done

      # `pnpm pack` does not run prepublishOnly, where both packages build: build first.
      - name: Build
        run: pnpm --filter "@sealant/api-contracts" --filter "@sealant/sdk" run build

      - name: Pack and check the tarballs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarballs"
          for package in packages/api-contracts packages/sdk; do
            (cd "$package" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          # Every file each manifest exports is in its tarball, and nothing sits outside package/.
          node tooling/scripts/check-tarball.mjs "$RUNNER_TEMP"/tarballs/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: next-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Holds the npm credential and runs nothing from the repository: no checkout. It checks each
  # tarball is ours, this version and this commit, that `next` would move forward, and publishes.
  publish:
    name: Publish npm prereleases
    needs: [plan, pack]
    # npm trusted publishing (OIDC) needs a GitHub-hosted runner: this job stays off Blacksmith.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: next
    permissions:
      id-token: write
    steps:
      # Node 24: trusted publishing needs the bundled npm >= 11.5.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm's own tarball reader, at a fixed version, installed here and not from the repository.
      - name: Install pacote
        run:
          npm install --prefix "$RUNNER_TEMP/tools" --no-save --no-package-lock --ignore-scripts
          --no-audit --no-fund pacote@21.5.0

      - uses: actions/download-artifact@v4
        with:
          name: next-tarballs
          path: tarballs

      - name: Rebuild and publish under next
        working-directory: tarballs
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # --- republish ---
          # republish.test.mjs runs this block as written, against a stub registry. The tarball pack built is
          # never published as it is: npm's own reader (pacote, pinned in this job) extracts it, package.json
          # is rewritten from an allowlist (no `tag`, no scripts, no publishConfig but `access`), the rewritten
          # manifest is checked, and `npm pack` builds the tarball that is published. What is checked is what
          # is published. Three earlier checks of the tarball as built each missed a way npm reads it
          # differently (a second manifest outside package/, a `tag` field, package/./package.json).
          # Failures inside $(...) stop the job too.
          shopt -s inherit_errexit
          KEEP_FIELDS='["name","version","description","license","repository","homepage","bugs","keywords","type","main","module","types","typings","exports","files","bin","man","directories","engines","dependencies","peerDependencies","peerDependenciesMeta","optionalDependencies","gitHead"]'

          # The registry's record of a package, retried; a failure or a 404 stops the job: never guessed.
          packument() {
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [name, registry] = process.argv.slice(1);
              const url = new URL(name.replace("/", "%2f"), registry.endsWith("/") ? registry : `${registry}/`);
              const run = async () => {
                for (let attempt = 1; attempt <= 4; attempt += 1) {
                  try {
                    const response = await fetch(url, { headers: { accept: "application/json" } });
                    if (response.ok) return process.stdout.write(JSON.stringify(await response.json()));
                    if (attempt === 4) throw new Error(`the registry answered ${response.status} for ${name}`);
                  } catch (error) {
                    if (attempt === 4) {
                      console.error(`::error::${error.message}`);
                      process.exit(1);
                    }
                  }
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1500));
                }
              };
              run();
            ' "$1" "$(npm config get registry)"
          }

          # A dist-tag's version, or nothing.
          dist_tag() {
            local record
            record=$(packument "$1")
            node -e 'process.stdout.write(String(JSON.parse(process.argv[1])["dist-tags"]?.[process.argv[2]] ?? ""))' "$record" "$2"
          }

          # The commit a published version came from ("unknown" without gitHead), or nothing if unpublished.
          published_from() {
            local record
            record=$(packument "$1")
            node -e '
              const found = JSON.parse(process.argv[1]).versions?.[process.argv[2]];
              process.stdout.write(found === undefined ? "" : String(found.gitHead ?? "unknown"));
            ' "$record" "$2"
          }

          # Whether $1 is a newer next version than $2 (X.Y.Z-next.N; a stable X.Y.Z sorts after them).
          newer() {
            node -e '
              const order = (v) => {
                const [core, n] = v.split("-next.");
                return [...core.split(".").map(Number), n === undefined ? Infinity : Number(n)];
              };
              const [a, b] = [order(process.argv[1]), order(process.argv[2])];
              if ([...a, ...b].some(Number.isNaN)) process.exit(2);
              const i = a.findIndex((x, k) => x !== b[k]);
              process.exit(i >= 0 && a[i] > b[i] ? 0 : 1);
            ' "$1" "$2"
          }

          # Extracts <tarball> with pacote, rewrites and checks its manifest, repacks it; prints the new path.
          rebuild_tarball() {
            local tarball=$1 name=$2 version=$3 commit=$4 channel=$5 work packed
            work=$(mktemp -d)
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const pacote = require(process.env.PACOTE);
              const [tarball, dir, name, version, commit, channel, keepText] = process.argv.slice(1);
              const run = async () => {
                await pacote.extract(`file:${path.resolve(tarball)}`, dir);
                const read = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8"));
                const manifest = {};
                for (const field of JSON.parse(keepText)) if (field in read) manifest[field] = read[field];
                if (read.publishConfig?.access !== undefined) manifest.publishConfig = { access: read.publishConfig.access };
                const shape = channel === "next" ? /^\d+\.\d+\.\d+-next\.\d+$/ : /^\d+\.\d+\.\d+$/;
                const problems = [
                  manifest.name !== name && `name ${manifest.name}, not ${name}`,
                  manifest.version !== version && `version ${manifest.version}, not ${version}`,
                  !shape.test(String(manifest.version)) && `${manifest.version} is not a ${channel} version`,
                  manifest.gitHead !== commit && `gitHead ${manifest.gitHead}, not ${commit}`,
                ].filter(Boolean);
                if (problems.length > 0) {
                  console.error(`::error::${name}: ${problems.join("; ")}`);
                  process.exit(1);
                }
                fs.writeFileSync(path.join(dir, "package.json"), `${JSON.stringify(manifest, null, 2)}\n`);
              };
              run().catch((error) => {
                console.error(`::error::${name}: ${error.message}`);
                process.exit(1);
              });
            ' "$tarball" "$work/package" "$name" "$version" "$commit" "$channel" "$KEEP_FIELDS" >&2
            # A packed .npmrc would configure the pack below; nothing else in the tree runs.
            find "$work/package" -name .npmrc -delete
            packed=$(cd "$work/package" && npm pack --ignore-scripts --json --pack-destination "$work")
            printf '%s/%s\n' "$work" "$(node -e 'process.stdout.write(JSON.parse(process.argv[1])[0].filename)' "$packed")"
          }

          # Publishes <tarball> as <name>@<version> from <commit> under <channel>; extra npm flags follow.
          # A version already published from this commit is done; from another commit, refused. Under next:
          # refused unless newer than the current next, checked here, right before publishing, so a re-run of
          # an old job cannot move next back; and afterwards `latest` must not be this version.
          publish_rebuilt() {
            local tarball=$1 name=$2 version=$3 commit=$4 channel=$5 from current latest_before latest rebuilt
            shift 5
            from=$(published_from "$name" "$version")
            if [[ -n $from ]]; then
              if [[ $from != "$commit" ]]; then
                echo "::error::$name@$version was published from $from, not $commit."
                return 1
              fi
              echo "$name@$version is already published from this commit."
              return 0
            fi
            latest_before=$(dist_tag "$name" latest)
            if [[ $channel == next ]]; then
              current=$(dist_tag "$name" next)
              if [[ -n $current ]] && ! newer "$version" "$current"; then
                echo "::error::$name's next is already $current, not older than $version. Nothing was published."
                return 1
              fi
            fi
            rebuilt=$(rebuild_tarball "$tarball" "$name" "$version" "$commit" "$channel")
            npm publish "$rebuilt" --tag "$channel" --access public --ignore-scripts "$@"
            if [[ $channel == next ]]; then
              latest=$(dist_tag "$name" latest)
              if [[ $latest == "$version" ]]; then
                echo "::error::$name@$version became latest. Moving latest back to ${latest_before:-nothing}."
                if [[ -z $latest_before ]] || ! npm dist-tag add "$name@$latest_before" latest; then
                  echo "::error::Could not move latest back. Run: npm dist-tag add $name@$latest_before latest"
                fi
                return 1
              fi
            fi
          }
          # --- end republish ---

          export PACOTE="$RUNNER_TEMP/tools/node_modules/pacote"
          # The contract first: the SDK depends on its exact version.
          for name in api-contracts sdk; do
            tarball="sealant-$name-$VERSION.tgz"
            [[ -f $tarball ]] || { echo "::error::$tarball is missing."; exit 1; }
            publish_rebuilt "$tarball" "@sealant/$name" "$VERSION" "$GITHUB_SHA" next --provenance
          done
          {
            echo "## Sealant $VERSION"
            echo
            echo "From \`$GITHUB_SHA\`. \`@sealant/sdk@$VERSION\` and \`@sealant/api-contracts@$VERSION\` on npm \`next\`."
            echo
            echo "Pin it in Mend: \`node scripts/sealant-pins.mjs pin $VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
