{{- $wsns := include "sealant.workspaceNamespace" . }}
{{- if and .Values.workspaces.createNamespace (ne $wsns .Release.Namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $wsns }}
  labels:
    pod-security.kubernetes.io/enforce: {{ .Values.workspaces.podSecurityEnforce }}
    pod-security.kubernetes.io/warn: restricted
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-control-plane
  labels: {{ include "sealant.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-worker
  labels: {{ include "sealant.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workspaces.serviceAccount }}
  namespace: {{ $wsns }}
  labels: {{ include "sealant.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workspaces.buildServiceAccount }}
  namespace: {{ $wsns }}
  labels: {{ include "sealant.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Exactly the verbs packages/workspaces/src/runtime/kubernetes/api.ts and images/kubernetes/api.ts use.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ $wsns }}
  labels: {{ include "sealant.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ $wsns }}
  labels: {{ include "sealant.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-worker }
subjects:
  - { kind: ServiceAccount, name: {{ .Release.Name }}-worker, namespace: {{ .Release.Namespace }} }
