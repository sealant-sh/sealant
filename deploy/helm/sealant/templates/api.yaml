apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{ include "sealant.labels" . | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector: {{ include "sealant.component" (dict "root" . "name" "api") | nindent 4 }}
  ports: [{ name: http, port: 4000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{ include "sealant.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{ include "sealant.component" (dict "root" . "name" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "sealant.component" (dict "root" . "name" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-control-plane
      automountServiceAccountToken: false
      imagePullSecrets: {{ toYaml .Values.image.pullSecrets | nindent 8 }}
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      # Migrations run as an init container on every API pod start: idempotent (drizzle holds a
      # lock), correct on first install (waits for Postgres via restarts) and on upgrades (the
      # new schema lands before the new server serves). No Helm hooks — nothing to race.
      initContainers:
        - name: migrate
          image: {{ include "sealant.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, dist/migrate.js]
          env:
            {{- include "sealant.secretEnv" . | nindent 12 }}
            - name: DATABASE_URL
              value: {{ include "sealant.databaseUrl" . | quote }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      containers:
        - name: api
          image: {{ include "sealant.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 4000, name: http }]
          env:
            {{- include "sealant.secretEnv" . | nindent 12 }}
            {{- include "sealant.controlTlsEnv" . | nindent 12 }}
            - { name: PORT, value: "4000" }
            # The create-time capability check for cluster env references reads the runtime
            # adapter here in the API, not only in the worker — without this, every chart
            # install refuses `envFrom`/`serviceAccountName` claiming the docker runtime.
            - { name: DEFAULT_RUNTIME_ADAPTER, value: k8s }
            - name: DATABASE_URL
              value: {{ include "sealant.databaseUrl" . | quote }}
            - name: RABBITMQ_URL
              value: {{ include "sealant.amqpUrl" . | quote }}
            - { name: REGISTRY_BASE_URL, value: {{ include "sealant.registryBaseUrl" . | quote }} }
            - { name: REGISTRY_PUSH_REGISTRY, value: {{ include "sealant.pushRegistry" . | quote }} }
            - { name: CORS_ALLOWED_ORIGINS, value: {{ .Values.api.corsAllowedOrigins | quote }} }
            # Closes the control plane: every /v1 request needs one of these service keys (Mend
            # holds one). Optional — absent keeps the open loopback-only model.
            - name: SEALANT_SERVICE_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SEALANT_SERVICE_KEYS
                  optional: true
            - name: WORKSPACE_SSH_GATEWAY_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: WORKSPACE_SSH_GATEWAY_TOKEN } }
            - { name: WORKSPACE_SSH_GATEWAY_HOST, value: {{ .Values.api.sshGateway.host | default (printf "%s-ssh-gateway" .Release.Name) | quote }} }
            - { name: WORKSPACE_SSH_GATEWAY_PORT, value: {{ .Values.api.sshGateway.port | quote }} }
            - { name: WORKSPACE_SSH_GATEWAY_USERNAME_PREFIX, value: ws }
            - { name: GITHUB_APP_ID, value: {{ .Values.github.appId | quote }} }
            - name: SEALANT_MOUNT_ALLOWED_STORE_ROOTS
              value: {{ (include "sealant.allowedRoots" .) | quote }}
          volumeMounts:
            - { name: control-tls, mountPath: /etc/sealant/control-tls, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      volumes:
        - name: control-tls
          secret: { secretName: {{ .Release.Name }}-control-client-tls }
