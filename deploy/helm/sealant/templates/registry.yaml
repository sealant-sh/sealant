{{- if .Values.registry.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{ include "sealant.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": { "rootDirectory": "/var/lib/registry", "dedupe": true, "gc": true, "gcDelay": "1h", "gcInterval": "24h" },
      "http": { "address": "0.0.0.0", "port": "5000", "compat": ["docker2s2"] },
      "log": { "level": "info" }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{ include "sealant.labels" . | nindent 4 }}
spec:
  selector: {{ include "sealant.component" (dict "root" . "name" "registry") | nindent 4 }}
  ports: [{ name: http, port: 5000 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{ include "sealant.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.registry.storageClassName }}
  storageClassName: {{ .Values.registry.storageClassName }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.registry.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-registry
  labels: {{ include "sealant.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{ include "sealant.component" (dict "root" . "name" "registry") | nindent 6 }}
  template:
    metadata:
      labels: {{ include "sealant.component" (dict "root" . "name" "registry") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: zot
          image: {{ .Values.registry.image }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          args: [serve, /etc/zot/config.json]
          ports: [{ containerPort: 5000, name: http }]
          volumeMounts:
            - { name: config, mountPath: /etc/zot }
            - { name: data, mountPath: /var/lib/registry }
      volumes:
        - name: config
          configMap: { name: {{ .Release.Name }}-registry }
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-registry }
{{- end }}
