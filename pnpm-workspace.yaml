packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  ssh2: true
  workerd: true

catalog:
  "@anthropic-ai/claude-agent-sdk": ^0.3.201
  "@effect/platform-node": 4.0.0-beta.85
  # Not a direct dependency: pinned here only so the override below shares this version line.
  "@effect/platform-node-shared": 4.0.0-beta.85
  "@effect/sql-pg": 4.0.0-beta.85
  "@effect/vitest": 4.0.0-beta.85
  "@cloudflare/vite-plugin": ^1.30.2
  "@fontsource/plus-jakarta-sans": ^5.2.8
  "@kubernetes/client-node": ^2.0.0
  "@fontsource/space-grotesk": ^5.2.8
  "@tailwindcss/typography": ^0.5.16
  "@tailwindcss/vite": ^4.1.18
  "@t3-oss/env-core": ^0.13.11
  "@tanstack/devtools-vite": 0.8.0
  "@tanstack/react-devtools": 0.10.7
  "@tanstack/react-form": 1.33.0
  "@tanstack/react-query": ^5.101.0
  "@tanstack/react-router": 1.170.16
  "@tanstack/react-router-devtools": 1.167.0
  "@tanstack/react-router-ssr-query": 1.167.1
  "@tanstack/react-start": 1.168.26
  "@tanstack/router-plugin": ^1.132.0
  "@testing-library/dom": ^10.4.1
  "@testing-library/react": ^16.3.0
  "@types/node": ^22.10.2
  "@types/ws": ^8.18.1
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.1.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  framer-motion: ^12.23.24
  dotenv-cli: ^11.0.0
  effect: 4.0.0-beta.85
  jsdom: ^28.1.0
  lucide-react: ^0.545.0
  pg-boss: ^12.30.0
  react: 19.2.3
  react-dom: 19.2.3
  tailwind-merge: ^3.5.0
  tailwindcss: ^4.1.18
  typescript: ^5.7.2
  vite: ^7.3.1
  vite-tsconfig-paths: ^5.1.4
  vitest: ^3.0.5
  ws: ^8.18.3
  wrangler: ^4.78.0
  zod: ^4.1.12

minimumReleaseAgeExclude:
  - "@sealant/runtime-client@0.6.2 || 0.7.0 || 0.11.0 || 0.13.0 || 0.14.0 || 0.15.0 || 0.15.1 ||
    0.15.2 || 0.16.0"
  - "@sealant/runtime-protocol@0.6.2 || 0.7.0 || 0.11.0 || 0.13.0 || 0.14.0 || 0.15.0 || 0.15.1 ||
    0.15.2 || 0.16.0"

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - msw

# @effect/platform-node depends on @effect/platform-node-shared with a caret range, and the caret
# on a prerelease (^4.0.0-beta.85) also matches every later 4.0.0-rc.N. Image builds and CI install
# with --lockfile=false, so they re-resolve that range on every run: rc.114 shipped 2026-09-11 and
# the sealant-api image build broke with esbuild "Could not resolve effect/ByteSize" against the
# beta.85 effect the workspace pins. Every other Effect package is either pinned exactly through the
# catalog above or resolved as a peer of one of those pins; this is the only floating edge.
overrides:
  "@effect/platform-node-shared": "catalog:"
