packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  ssh2: true
  workerd: true

catalog:
  "@anthropic-ai/claude-agent-sdk": ^0.3.201
  "@openai/codex": 0.148.0
  # The Effect family pinned exactly, all on one version: Effect releases every package together and
  # a program runs one effect with one set of @effect/* beside it.
  "@effect/platform-node": 4.0.5
  # Not a direct dependency: pinned here only so the override below shares this version line.
  "@effect/platform-node-shared": 4.0.5
  "@effect/sql-pg": 4.0.5
  "@effect/vitest": 4.0.5
  "@cloudflare/vite-plugin": ^1.30.2
  "@fontsource/plus-jakarta-sans": ^5.2.8
  "@kubernetes/client-node": ^2.0.0
  "@fontsource/space-grotesk": ^5.2.8
  "@tailwindcss/typography": ^0.5.16
  "@tailwindcss/vite": ^4.1.18
  "@t3-oss/env-core": ^0.13.11
  "@tanstack/devtools-vite": 0.8.5
  "@tanstack/react-devtools": 0.10.7
  "@tanstack/react-form": 1.33.0
  "@tanstack/react-query": ^5.104.4
  "@tanstack/react-router": 1.170.45
  "@tanstack/react-router-devtools": 1.167.0
  "@tanstack/react-router-ssr-query": 1.167.3
  "@tanstack/react-start": 1.169.3
  "@tanstack/router-plugin": 1.168.47
  "@testing-library/dom": ^10.4.1
  "@testing-library/react": ^16.3.0
  "@types/node": ^22.10.2
  "@types/ws": ^8.18.1
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.1.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  framer-motion: ^12.23.24
  dotenv-cli: ^11.0.0
  # drizzle-orm and drizzle-kit pinned exactly and together: the 1.0.0-rc.5 preview build (dist-tag
  # rc5), the first whose Effect driver (drizzle-orm/effect-postgres, behind SealantDB) loads on
  # Effect 4.0.x; rc.3 and rc.4 use Schema.TaggedErrorClass, which Effect 4.0.0 removed.
  drizzle-kit: 1.0.0-rc.5-5935859
  drizzle-orm: 1.0.0-rc.5-5935859
  effect: 4.0.5
  jsdom: ^28.1.0
  lucide-react: ^0.545.0
  pg-boss: ^12.30.0
  react: 19.2.3
  react-dom: 19.2.3
  tailwind-merge: ^3.5.0
  tailwindcss: ^4.1.18
  typescript: ^7.0.2
  # TanStack Start 1.0 (@tanstack/react-start 1.169) requires Vite 8.
  vite: ^8.3.4
  vite-tsconfig-paths: ^5.1.4
  # @effect/vitest 4 asks for Vitest 5.
  vitest: 5.0.5
  ws: ^8.18.3
  wrangler: ^4.78.0
  yaml: ^2.9.0
  zod: ^4.1.12

# Our own sealantd packages, published only by sealant-sh/sealantd's workflows with provenance, are
# never held back by the release-age policy: a prerelease Core pins (0.20.0-next.N, published from
# sealantd's main minutes earlier) would otherwise wait a day. Installs are bound to the lockfile, so
# this lets no version in that the lockfile does not name (ADR 0015 in sealant-sh/mend).
minimumReleaseAgeExclude:
  - "@sealant/runtime-client"
  - "@sealant/runtime-protocol"
  - "@sealant/runtime-client-next"
  - "@sealant/runtime-protocol-next"
  - "@tanstack/query-core@5.104.4"
  - "@tanstack/react-query@5.104.4"

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - msw

# @effect/platform-node depends on @effect/platform-node-shared with a caret range (^4.0.5), which a
# fresh resolve would move to the newest 4.0.x and its own effect peer. In 2026-09 a floating edge
# like this one (^4.0.0-beta.85 matching rc.114) broke the sealant-api image build against the
# effect the workspace pins. Image builds and CI install with --frozen-lockfile, so nothing
# re-resolves at build time; the override keeps a lockfile regenerated from scratch on the same line.
overrides:
  "@effect/platform-node-shared": "catalog:"
