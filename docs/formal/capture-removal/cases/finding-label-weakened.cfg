\* module: CaptureRemovalLedger
\* expect: LabelNeverWeakened
\* group: fast
\* Finding, main's code: a terminal drain label is weakened. markRetained (`kept`), the stop
\* job's `stop-failed` and a drain's `save` write the label unranked, and the deleters that do not
\* hold the drain claim decide on a record they read before the removal. Expected to fail until the
\* code changes (README, "Findings").
SPECIFICATION Spec
CONSTANTS
    Deleters = {"d1", "d2"}
    Observers = {"o1", "o2"}
    RecoveryActors = {}
    MaxTokens = 3
    MaxAttests = 1
    MaxCrashes = 1
    SendMayOutliveBound = FALSE
    IssueChecksEvidence <- CodeIssueChecksEvidence
    ReauthNeedsCurrentDecision <- CodeReauthNeedsCurrentDecision
    OpenRefusedWhileIssued <- CodeOpenRefusedWhileIssued
    OpenRefusedWhenDeleted <- CodeOpenRefusedWhenDeleted
    ReleaseWaitsForUnknown <- CodeReleaseWaitsForUnknown
    ReleaseNeedsBound <- CodeReleaseNeedsBound
    CompleteOnlyOnSuccess <- CodeCompleteOnlyOnSuccess
    AuthorizeRefusesDeleted <- CodeAuthorizeRefusesDeleted
    AuthorizeChecksRecovery <- CodeAuthorizeChecksRecovery
    StopJobs = {"d1"}
    Drains = {"o1"}
    LabelRanked <- CodeLabelRanked
    UnrankedKeepsTerminal <- CodeUnrankedKeepsTerminal
    MissingNeedsGoneRuntime <- CodeMissingNeedsGoneRuntime
    TrackLabel = TRUE
INVARIANTS
    TypeOK
    LabelNeverWeakened
CHECK_DEADLOCK FALSE
