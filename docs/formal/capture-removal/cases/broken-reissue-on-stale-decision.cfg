\* module: CaptureRemovalLedger
\* expect: SentOnCurrentEvidence
\* group: fast
\* Broken variant, must fail.
\* reconcileIssuedDeletion re-bases a lapsed issued removal on the current version whatever
\* version the settler decided on (no `reauthorizedVersion === evidenceVersion`): the reissue
\* rests on a decision the evidence has moved past.
SPECIFICATION Spec
CONSTANTS
    Deleters = {"d1", "d2"}
    Observers = {"o1", "o2"}
    RecoveryActors = {}
    MaxTokens = 3
    MaxAttests = 1
    MaxCrashes = 1
    SendMayOutliveBound = FALSE
    IssueChecksEvidence <- CodeIssueChecksEvidence
    ReauthNeedsCurrentDecision = FALSE
    OpenRefusedWhileIssued <- CodeOpenRefusedWhileIssued
    OpenRefusedWhenDeleted <- CodeOpenRefusedWhenDeleted
    ReleaseWaitsForUnknown <- CodeReleaseWaitsForUnknown
    ReleaseNeedsBound <- CodeReleaseNeedsBound
    CompleteOnlyOnSuccess <- CodeCompleteOnlyOnSuccess
    AuthorizeRefusesDeleted <- CodeAuthorizeRefusesDeleted
    AuthorizeChecksRecovery <- CodeAuthorizeChecksRecovery
INVARIANTS
    TypeOK
    SentOnCurrentEvidence
CHECK_DEADLOCK FALSE
