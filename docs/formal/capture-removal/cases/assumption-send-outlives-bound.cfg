\* module: CaptureRemovalLedger
\* expect: RemovalStaysIssued
\* group: fast
\* Timing the code relies on, turned off: the deleter that wrote issueDeletion stalls past the
\* runtime's bound (`removalFenceMs`, measured from that write) before its runtime call goes out.
\* Must fail: a settler releases the removal as fenced, and the late request removes the executor
\* while the ledger says no removal is under way (README, "Assumptions").
SPECIFICATION Spec
CONSTANTS
    Deleters = {"d1", "d2"}
    Observers = {"o1", "o2"}
    RecoveryActors = {}
    MaxTokens = 3
    MaxAttests = 1
    MaxCrashes = 1
    SendMayOutliveBound = TRUE
    IssueChecksEvidence <- CodeIssueChecksEvidence
    ReauthNeedsCurrentDecision <- CodeReauthNeedsCurrentDecision
    OpenRefusedWhileIssued <- CodeOpenRefusedWhileIssued
    OpenRefusedWhenDeleted <- CodeOpenRefusedWhenDeleted
    ReleaseWaitsForUnknown <- CodeReleaseWaitsForUnknown
    ReleaseNeedsBound <- CodeReleaseNeedsBound
    CompleteOnlyOnSuccess <- CodeCompleteOnlyOnSuccess
    AuthorizeRefusesDeleted <- CodeAuthorizeRefusesDeleted
    AuthorizeChecksRecovery <- CodeAuthorizeChecksRecovery
INVARIANTS
    TypeOK
    RemovalStaysIssued
CHECK_DEADLOCK FALSE
