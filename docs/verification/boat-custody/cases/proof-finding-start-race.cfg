\* module: BoatKeyProof
\* expect: KeyKeptWhileLeftover
\* group: fast
\* Finding P2-A (open): a rotation or removal commits between the check's account read and its
\* ledger insert; the check then creates with a key the account no longer has.
SPECIFICATION Spec
CONSTANTS
    Sweeps = {"sweep1"}
    MaxFaults = 2
    MaxCrashes = 1
    MaxAborts = 2
    GetMay404WhileCreating = FALSE
    LateSave = FALSE
    RotateToOtherAccount = TRUE
    ClaimMayPassWhileRunning = FALSE
    OwnerMayRaceCheckStart = TRUE
    KeyGuardsOnProofs <- CodeKeyGuardsOnProofs
    SweepWaitsForListingLag <- CodeSweepWaitsForListingLag
    FinishMarksPending <- CodeFinishMarksPending
    StartChecksAccount = FALSE
    FenceCheckOnRow = FALSE
    SnapshotLag = FALSE
INVARIANTS
    NothingLeftWhenSettled
    KeyKeptWhileLeftover
CHECK_DEADLOCK FALSE
