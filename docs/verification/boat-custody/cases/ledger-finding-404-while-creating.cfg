\* module: BoatRunLedger
\* expect: NoForgottenVM
\* group: fast
\* Finding P1-B (open, needs Boat's silence): GET answers 404 for a VM still being created.
\* A 404 read before another observer records created_seen_at is committed after it as not-found.
SPECIFICATION Spec
CONSTANTS
    Sweeps = {"sweep1"}
    Inspectors = {"inspect"}
    MaxSends = 3
    MaxLost = 1
    MaxRetries = 1
    MaxLapses = 0
    MaxCrashes = 1
    SweepMayLoadDuringFirstCreate = FALSE
    LimitCheckedBeforeKey = TRUE
    SnapshotCheckedBeforeKey = FALSE
    GetMay404WhileCreating = TRUE
    SnapshotMayVanish = TRUE
    FirstCreateRejectedKinds <- CodeFirstCreateRejected
    FirstRefusalRecords <- CodeFirstRefusalRecords
    ReplayRejectedKinds <- CodeReplayRejected
    MarkReplayBeforeSend = FALSE
    NotFoundNeedsSeenBeforeGet = FALSE
VIEW View
INVARIANTS
    TypeOK
    NoForgottenVM
CHECK_DEADLOCK FALSE
