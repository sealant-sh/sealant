\* module: BoatKeyProof
\* expect: NothingLeftWhenSettled
\* group: fast
\* Finding P2-B (open): the check outlives its 15-minute claim; the sweep settles the row from a copy
\* read before the check issued something, or deletes a snapshot by name before its save lands.
SPECIFICATION Spec
CONSTANTS
    Sweeps = {"sweep1"}
    MaxFaults = 2
    MaxCrashes = 1
    MaxAborts = 2
    GetMay404WhileCreating = FALSE
    LateSave = FALSE
    RotateToOtherAccount = TRUE
    ClaimMayPassWhileRunning = TRUE
    OwnerMayRaceCheckStart = FALSE
    KeyGuardsOnProofs <- CodeKeyGuardsOnProofs
    SweepWaitsForListingLag <- CodeSweepWaitsForListingLag
    FinishMarksPending <- CodeFinishMarksPending
    StartChecksAccount = FALSE
    FenceCheckOnRow = FALSE
    SnapshotLag = FALSE
INVARIANTS
    NothingLeftWhenSettled
    KeyKeptWhileLeftover
CHECK_DEADLOCK FALSE
