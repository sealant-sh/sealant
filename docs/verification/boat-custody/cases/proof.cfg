\* module: BoatKeyProof
\* expect: pass
\* group: fast
\* Promise 2, main's code, safety. The check's 15-minute claim passes only after its process died,
\* no removal or rotation commits between the check's account read and its insert, a save Core
\* gave up on never reaches Boat after the delete, and GET never answers 404 for a VM being created.
\* The open findings need one of these; each has its own case below.
SPECIFICATION Spec
CONSTANTS
    Sweeps = {"sweep1"}
    MaxFaults = 2
    MaxCrashes = 1
    MaxAborts = 2
    GetMay404WhileCreating = FALSE
    LateSave = FALSE
    RotateToOtherAccount = TRUE
    ClaimMayPassWhileRunning = FALSE
    OwnerMayRaceCheckStart = FALSE
    KeyGuardsOnProofs <- CodeKeyGuardsOnProofs
    SweepWaitsForListingLag <- CodeSweepWaitsForListingLag
    FinishMarksPending <- CodeFinishMarksPending
    StartChecksAccount = FALSE
    FenceCheckOnRow = FALSE
    SnapshotLag = FALSE
INVARIANTS
    NothingLeftWhenSettled
    KeyKeptWhileLeftover
CHECK_DEADLOCK FALSE
