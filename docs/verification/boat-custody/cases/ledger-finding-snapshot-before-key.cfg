\* module: BoatRunLedger
\* expect: NoForgottenVM
\* group: fast
\* Finding P1-C (open, needs Boat's silence): a replay under a key Boat linked to a VM is refused
\* snapshot_not_found because its source snapshot was deleted; `replayRejected` records never-created.
SPECIFICATION Spec
CONSTANTS
    Sweeps = {"sweep1"}
    Inspectors = {"inspect"}
    MaxSends = 3
    MaxLost = 1
    MaxRetries = 1
    MaxLapses = 0
    MaxCrashes = 1
    SweepMayLoadDuringFirstCreate = FALSE
    LimitCheckedBeforeKey = TRUE
    SnapshotCheckedBeforeKey = TRUE
    GetMay404WhileCreating = FALSE
    SnapshotMayVanish = TRUE
    FirstCreateRejectedKinds <- CodeFirstCreateRejected
    FirstRefusalRecords <- CodeFirstRefusalRecords
    ReplayRejectedKinds <- CodeReplayRejected
    MarkReplayBeforeSend = FALSE
    NotFoundNeedsSeenBeforeGet = FALSE
VIEW View
INVARIANTS
    TypeOK
    NoForgottenVM
CHECK_DEADLOCK FALSE
