\* module: BoatRunLedger
\* expect: pass
\* group: deep
\* As `ledger`, and a live launch's lease may lapse once (its worker stalls, or cannot reach the
\* database, for 2 minutes) while it goes on; two drive retries. A sweep may load the run while its
\* first create is out (P1-A's way in through a lapsed lease, or a stop; fixed by SLNT-825).
SPECIFICATION Spec
CONSTANTS
    Sweeps = {"sweep1"}
    Inspectors = {"inspect"}
    MaxSends = 3
    MaxLost = 1
    MaxRetries = 2
    MaxLapses = 1
    MaxCrashes = 1
    SweepMayLoadDuringFirstCreate = TRUE
    LimitCheckedBeforeKey = TRUE
    SnapshotCheckedBeforeKey = FALSE
    GetMay404WhileCreating = FALSE
    SnapshotMayVanish = TRUE
    FirstCreateRejectedKinds <- CodeFirstCreateRejected
    FirstRefusalRecords <- CodeFirstRefusalRecords
    ReplayRejectedKinds <- CodeReplayRejected
    MarkReplayBeforeSend <- CodeMarkReplayBeforeSend
    NotFoundNeedsSeenBeforeGet = FALSE
VIEW View
INVARIANTS
    TypeOK
    NoForgottenVM
CHECK_DEADLOCK FALSE
