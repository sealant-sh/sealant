\* module: BoatRunLedger
\* expect: NoForgottenVM
\* group: fast
\* Finding P1-A (open): the owner stops the run while its first create is out (markStopped makes
\* launchInFlight false; a lapsed lease does the same). The sweep replays, the launch records
\* never-created on the first create's refusal, the replay makes the VM.
SPECIFICATION Spec
CONSTANTS
    Sweeps = {"sweep1"}
    Inspectors = {"inspect"}
    MaxSends = 3
    MaxLost = 1
    MaxRetries = 1
    MaxLapses = 0
    MaxCrashes = 1
    SweepMayLoadDuringFirstCreate = TRUE
    LimitCheckedBeforeKey = TRUE
    SnapshotCheckedBeforeKey = FALSE
    GetMay404WhileCreating = FALSE
    SnapshotMayVanish = TRUE
    FirstCreateRejectedKinds <- CodeFirstCreateRejected
    FirstRefusalRecords <- CodeFirstRefusalRecords
    ReplayRejectedKinds <- CodeReplayRejected
    MarkReplayBeforeSend = FALSE
    NotFoundNeedsSeenBeforeGet = FALSE
VIEW View
INVARIANTS
    TypeOK
    NoForgottenVM
CHECK_DEADLOCK FALSE
