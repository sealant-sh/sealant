\* module: BoatRunLedger
\* expect: pass
\* group: fast
\* states: 9438957
\* Promise 1, main's code. Boat may do everything its docs allow, and on its silences what main
\* is written against: it looks a replay's key up before the source snapshot, and GET never
\* answers 404 for a VM it is creating. The owner may stop the run at any point, but no VM sweep
\* loads it while its first create is unanswered; no live launch's lease lapses (see
\* `ledger-lease-lapse`). The open findings need
\* one of these; each has its own case below.
SPECIFICATION Spec
CONSTANTS
    Sweeps = {"sweep1"}
    Inspectors = {"inspect"}
    MaxSends = 3
    MaxLost = 1
    MaxRetries = 1
    MaxLapses = 0
    MaxCrashes = 1
    SweepMayLoadDuringFirstCreate = FALSE
    LimitCheckedBeforeKey = TRUE
    SnapshotCheckedBeforeKey = FALSE
    GetMay404WhileCreating = FALSE
    SnapshotMayVanish = TRUE
    FirstCreateRejectedKinds <- CodeFirstCreateRejected
    FirstRefusalRecords <- CodeFirstRefusalRecords
    ReplayRejectedKinds <- CodeReplayRejected
    MarkReplayBeforeSend <- CodeMarkReplayBeforeSend
    NotFoundNeedsSeenBeforeGet = FALSE
VIEW View
INVARIANTS
    TypeOK
    NoForgottenVM
CHECK_DEADLOCK FALSE
